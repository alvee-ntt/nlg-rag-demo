[project]
name = "flexlife-agent-api"
version = "0.1.0"
description = "FastAPI service for the FlexLife conversational agent"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-foundry==1.14.0",
    "azure-identity>=1.25,<2",
    "fastapi>=0.118,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.11,<3",
    "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "prompt_library", "prompt_studio_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
