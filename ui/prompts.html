<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt Studio</title>
  <style>
    :root {
      --ink: #17211f;
      --muted: #64716d;
      --faint: #8b9692;
      --paper: #f5f3ed;
      --panel: #fffefa;
      --line: #dcded7;
      --line-strong: #c5cac2;
      --accent: #176b5b;
      --accent-dark: #0f5145;
      --accent-soft: #e3f0eb;
      --navy: #20324a;
      --amber: #b97825;
      --shadow: 0 18px 50px rgba(24, 39, 35, .09);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(23,107,91,.08), transparent 26rem),
        var(--paper);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .shell { min-height: 100%; display: grid; grid-template-rows: 64px 1fr; }
    .topbar {
      display: flex; align-items: center; gap: 14px; padding: 0 24px;
      color: #eef7f4; background: #142c27; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .mark {
      display: grid; place-items: center; width: 35px; height: 35px; border-radius: 11px;
      background: linear-gradient(145deg, #63c6aa, #2b8b75); color: #0b2a23;
      font-family: Georgia, serif; font-size: 21px; font-weight: 700; box-shadow: inset 0 1px rgba(255,255,255,.45);
    }
    .brand { font: 600 19px/1.1 Georgia, serif; letter-spacing: .01em; }
    .brand small { display: block; margin-top: 3px; color: #a8c1ba; font: 500 10px/1 ui-sans-serif, system-ui; text-transform: uppercase; letter-spacing: .16em; }
    .studio-nav { display: flex; align-items: center; gap: 5px; margin-left: 20px; }
    .studio-nav a { padding: 8px 11px; border-radius: 8px; color: #bcd0ca; text-decoration: none; font-size: 12px; font-weight: 750; }
    .studio-nav a:hover { color: white; background: rgba(255,255,255,.08); }
    .studio-nav a.on { color: white; background: rgba(99,198,170,.18); }
    .top-spacer { flex: 1; }
    .demo-pill { padding: 6px 10px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; color: #c7d9d4; font-size: 12px; }
    .layout { min-height: 0; display: grid; grid-template-columns: 310px minmax(0, 1fr); }
    .sidebar {
      min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr auto;
      background: rgba(255,254,250,.78); border-right: 1px solid var(--line); backdrop-filter: blur(16px);
    }
    .side-head { padding: 25px 22px 14px; }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .13em; font-size: 11px; font-weight: 800; }
    h1, h2, h3, p { margin-top: 0; }
    .side-head h1 { margin: 5px 0 6px; font: 600 27px/1.15 Georgia, serif; }
    .side-head p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .search { position: relative; margin: 0 16px 13px; }
    .search svg { position: absolute; width: 16px; left: 12px; top: 11px; color: var(--faint); }
    .search input {
      width: 100%; height: 39px; padding: 0 12px 0 36px; border: 1px solid var(--line);
      border-radius: 11px; outline: none; background: rgba(255,255,255,.75);
    }
    .search input:focus { border-color: #77a99d; box-shadow: 0 0 0 3px rgba(23,107,91,.1); }
    .prompt-list { min-height: 0; overflow-y: auto; padding: 1px 10px 16px; }
    .prompt-card {
      width: 100%; text-align: left; border: 1px solid transparent; border-radius: 13px;
      padding: 12px; margin: 3px 0; background: transparent; cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .prompt-card:hover { background: #f0f3ef; transform: translateY(-1px); }
    .prompt-card.on { background: var(--accent-soft); border-color: #b8d2c8; }
    .prompt-key { display: block; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 700; color: var(--navy); overflow-wrap: anywhere; }
    .prompt-purpose { display: -webkit-box; margin-top: 5px; color: var(--muted); font-size: 12px; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .prompt-meta { display: flex; gap: 7px; align-items: center; margin-top: 9px; color: var(--faint); font-size: 11px; }
    .vtag { padding: 2px 7px; border-radius: 99px; background: rgba(23,107,91,.1); color: var(--accent-dark); font-weight: 700; }
    .side-foot { padding: 13px 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; }
    .workspace { min-width: 0; min-height: 0; overflow: auto; padding: 30px clamp(24px, 4vw, 60px) 50px; }
    .loading, .empty-state, .error-state { min-height: 65vh; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .loader { width: 30px; height: 30px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prompt-head { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 25px; }
    .head-main { min-width: 0; flex: 1; }
    .head-main h2 { margin: 6px 0 8px; font: 600 clamp(26px, 3vw, 38px)/1.12 Georgia, serif; overflow-wrap: anywhere; }
    .head-main p { max-width: 760px; color: var(--muted); font-size: 15px; }
    .head-actions { display: flex; gap: 9px; padding-top: 7px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px;
      padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--panel);
      cursor: pointer; font-weight: 700; transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(24,39,35,.08); }
    .btn.primary { color: white; border-color: var(--accent); background: var(--accent); }
    .btn.primary:hover:not(:disabled) { background: var(--accent-dark); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn svg { width: 16px; }
    .content-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
    .version-panel, .prompt-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .version-panel { position: sticky; top: 0; overflow: hidden; }
    .panel-title { padding: 16px 17px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
    .version-list { max-height: calc(100vh - 260px); overflow-y: auto; padding: 8px; }
    .version-row {
      width: 100%; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center;
      padding: 10px; border: 1px solid transparent; border-radius: 11px; background: none; cursor: pointer; text-align: left;
    }
    .version-row:hover { background: #f5f6f2; }
    .version-row.on { background: #edf4f0; border-color: #c6dbd3; }
    .version-num { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #eef0ec; color: var(--navy); font-weight: 800; }
    .version-row.on .version-num { background: var(--accent); color: white; }
    .version-copy strong { display: flex; align-items: center; gap: 5px; font-size: 13px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #40a887; }
    .version-copy span { display: block; color: var(--faint); font-size: 10px; margin-top: 2px; }
    .prompt-panel { min-width: 0; overflow: hidden; }
    .prompt-toolbar { min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
    .version-title { flex: 0 0 auto; white-space: nowrap; font: 600 19px/1.1 Georgia, serif; }
    .selected-badge { padding: 4px 8px; border-radius: 99px; color: var(--accent-dark); background: var(--accent-soft); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .toolbar-spacer { flex: 1; }
    .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: white; cursor: pointer; }
    .icon-btn:hover { background: #f2f4f0; }
    .icon-btn svg { width: 16px; }
    .prompt-body { padding: 22px; }
    .prompt-text {
      margin: 0; min-height: 280px; padding: 20px; border: 1px solid #e0e3dc; border-radius: 13px;
      background: #f8f8f4; color: #25302d; font: 13px/1.7 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2;
    }
    .detail-strip { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .detail-strip strong { color: var(--ink); }
    .notes { margin-top: 18px; padding: 14px 16px; border-left: 3px solid #d1a35f; border-radius: 4px 10px 10px 4px; background: #fbf4e9; }
    .notes label { display: block; margin-bottom: 4px; color: #86591c; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
    .notes p { margin: 0; color: #5e4b31; }
    .placeholders { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 17px; }
    .placeholder { padding: 4px 8px; border: 1px solid #cdd8d3; border-radius: 7px; color: var(--accent-dark); background: #f0f7f4; font: 11px "SFMono-Regular", Consolas, monospace; }
    .modal-wrap { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(17,31,28,.55); backdrop-filter: blur(4px); }
    .modal { width: min(860px, 100%); max-height: calc(100vh - 48px); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; border: 1px solid rgba(255,255,255,.5); border-radius: 20px; background: var(--panel); box-shadow: 0 28px 80px rgba(0,0,0,.22); }
    .modal-head, .modal-foot { display: flex; align-items: center; gap: 12px; padding: 17px 20px; }
    .modal-head { border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font: 600 22px Georgia, serif; }
    .modal-foot { justify-content: flex-end; border-top: 1px solid var(--line); }
    .modal-body { overflow-y: auto; padding: 20px; }
    .field { margin-bottom: 17px; }
    .field label { display: flex; justify-content: space-between; margin-bottom: 7px; font-weight: 800; font-size: 12px; }
    .field label span { color: var(--faint); font-weight: 500; }
    .field textarea, .field input {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 11px; outline: none; background: white;
    }
    .field textarea:focus, .field input:focus { border-color: #6b9f92; box-shadow: 0 0 0 3px rgba(23,107,91,.1); }
    #versionText { min-height: 390px; resize: vertical; padding: 15px; font: 13px/1.6 "SFMono-Regular", Consolas, monospace; }
    #versionNotes { min-height: 43px; padding: 10px 12px; }
    .hint { color: var(--muted); font-size: 12px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 40; max-width: 420px; padding: 12px 15px; border-radius: 11px; color: white; background: #18312b; box-shadow: 0 14px 40px rgba(0,0,0,.2); animation: toast-in .2s ease-out; }
    .toast.bad { background: #7d302f; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    .mobile-list { display: none; }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .workspace { padding: 22px 16px 40px; }
      .mobile-list { display: block; width: 100%; margin: 0 0 20px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: white; }
      .prompt-head { display: block; }
      .head-actions { padding-top: 3px; }
      .content-grid { grid-template-columns: 1fr; }
      .version-panel { position: static; }
      .version-list { display: flex; max-height: none; overflow-x: auto; }
      .version-row { min-width: 155px; }
      .topbar { padding: 0 15px; }
      .demo-pill { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="mark">P</div>
      <div class="brand">Prompt Studio<small>NLG RAG Demo</small></div>
      <nav class="studio-nav" aria-label="Prompt Studio"><a class="on" href="/prompts">Prompts</a><a href="/traces">Traces</a></nav>
      <div class="top-spacer"></div>
      <div class="demo-pill">Open demo workspace</div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="side-head">
          <div class="eyebrow">Library</div>
          <h1>Prompts</h1>
          <p>Browse definitions, inspect history, and choose what the application uses.</p>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Find a prompt…" autocomplete="off">
        </div>
        <div class="prompt-list" id="promptList"></div>
        <div class="side-foot" id="libraryCount">Loading prompt library…</div>
      </aside>
      <main class="workspace" id="workspace">
        <div class="loading"><div><div class="loader"></div>Loading Prompt Studio…</div></div>
      </main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
    (() => {
      "use strict";
      const $ = (q, root = document) => root.querySelector(q);
      const state = { prompts: [], current: null, version: null, query: "", busy: false };
      const icons = {
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
        x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      };

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
        const body = response.status === 204 ? null : await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
        return body;
      }

      function toast(message, bad = false) {
        const root = $("#toastRoot");
        root.innerHTML = "";
        const el = document.createElement("div");
        el.className = `toast${bad ? " bad" : ""}`;
        el.textContent = message;
        root.appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }

      function shortDate(value) {
        if (!value) return "Unknown date";
        return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" }).format(new Date(value));
      }

      function filteredPrompts() {
        const q = state.query.trim().toLowerCase();
        if (!q) return state.prompts;
        return state.prompts.filter((p) => `${p.key} ${p.purpose}`.toLowerCase().includes(q));
      }

      function renderLibrary() {
        const list = $("#promptList");
        list.innerHTML = "";
        const prompts = filteredPrompts();
        prompts.forEach((prompt) => {
          const button = document.createElement("button");
          button.className = `prompt-card${state.current?.key === prompt.key ? " on" : ""}`;
          const key = document.createElement("span"); key.className = "prompt-key"; key.textContent = prompt.key;
          const purpose = document.createElement("span"); purpose.className = "prompt-purpose"; purpose.textContent = prompt.purpose;
          const meta = document.createElement("span"); meta.className = "prompt-meta";
          const selected = document.createElement("span"); selected.className = "vtag"; selected.textContent = `v${prompt.selected_version ?? "—"}`;
          const count = document.createElement("span"); count.textContent = `${prompt.version_count} version${prompt.version_count === 1 ? "" : "s"}`;
          meta.append(selected, count); button.append(key, purpose, meta);
          button.onclick = () => selectPrompt(prompt.key);
          list.appendChild(button);
        });
        if (!prompts.length) {
          const empty = document.createElement("div"); empty.className = "side-foot"; empty.textContent = "No prompts match your search."; list.appendChild(empty);
        }
        $("#libraryCount").textContent = `${state.prompts.length} prompt definition${state.prompts.length === 1 ? "" : "s"}`;
      }

      function selectedFromHash() {
        const raw = decodeURIComponent(location.hash.slice(1));
        const [key, version] = raw.split("/v");
        return { key, version: version ? Number(version) : null };
      }

      function syncHash() {
        if (!state.current) return;
        const value = `${encodeURIComponent(state.current.key)}/v${state.version?.version || state.current.selected_version}`;
        if (location.hash.slice(1) !== value) history.replaceState(null, "", `#${value}`);
      }

      async function loadLibrary() {
        try {
          const data = await api("/v1/prompt-admin/prompts");
          state.prompts = data.prompts || [];
          renderLibrary();
          if (!state.prompts.length) return renderEmpty("No prompt definitions exist yet.");
          const hash = selectedFromHash();
          const initial = state.prompts.find((p) => p.key === hash.key) || state.prompts[0];
          await selectPrompt(initial.key, hash.version);
        } catch (error) {
          renderError(error.message);
        }
      }

      async function selectPrompt(key, preferredVersion = null) {
        if (state.busy) return;
        state.busy = true;
        $("#workspace").innerHTML = '<div class="loading"><div><div class="loader"></div>Loading prompt…</div></div>';
        try {
          state.current = await api(`/v1/prompt-admin/prompts/${encodeURIComponent(key)}`);
          state.version = state.current.versions.find((v) => v.version === preferredVersion)
            || state.current.versions.find((v) => v.selected)
            || state.current.versions[0];
          renderLibrary();
          renderPrompt();
          syncHash();
        } catch (error) {
          renderError(error.message);
        } finally {
          state.busy = false;
        }
      }

      function renderPrompt() {
        const p = state.current, v = state.version;
        if (!p || !v) return renderEmpty("This prompt has no versions yet.");
        const workspace = $("#workspace");
        workspace.innerHTML = `
          <select class="mobile-list" id="mobilePrompt"></select>
          <section class="prompt-head">
            <div class="head-main"><div class="eyebrow">Prompt definition</div><h2 id="promptKey"></h2><p id="promptPurpose"></p></div>
            <div class="head-actions"><button class="btn primary" id="newVersion">${icons.plus}New version</button></div>
          </section>
          <section class="content-grid">
            <aside class="version-panel"><div class="panel-title">Version history</div><div class="version-list" id="versionList"></div></aside>
            <article class="prompt-panel">
              <div class="prompt-toolbar">
                <div class="version-title" id="versionTitle"></div><span class="selected-badge" id="selectedBadge">In use</span>
                <span class="toolbar-spacer"></span><button class="btn" id="selectVersion">Use this version</button><button class="icon-btn" id="copyPrompt" title="Copy prompt">${icons.copy}</button>
              </div>
              <div class="prompt-body"><pre class="prompt-text" id="promptText"></pre><div class="placeholders" id="placeholders"></div><div class="detail-strip" id="detailStrip"></div><div class="notes" id="notes"><label>Change notes</label><p></p></div></div>
            </article>
          </section>`;
        $("#promptKey").textContent = p.key;
        $("#promptPurpose").textContent = p.purpose;
        const mobile = $("#mobilePrompt");
        state.prompts.forEach((item) => { const o = document.createElement("option"); o.value = item.key; o.textContent = item.key; o.selected = item.key === p.key; mobile.appendChild(o); });
        mobile.onchange = () => selectPrompt(mobile.value);
        renderVersions();
        $("#newVersion").onclick = openNewVersion;
      }

      function renderVersions() {
        const p = state.current, v = state.version;
        const list = $("#versionList"); list.innerHTML = "";
        p.versions.forEach((item) => {
          const button = document.createElement("button"); button.className = `version-row${item.version === v.version ? " on" : ""}`;
          const number = document.createElement("span"); number.className = "version-num"; number.textContent = item.version;
          const copy = document.createElement("span"); copy.className = "version-copy";
          const title = document.createElement("strong"); title.textContent = `Version ${item.version}`;
          if (item.selected) { const dot = document.createElement("i"); dot.className = "dot"; title.appendChild(dot); }
          const date = document.createElement("span"); date.textContent = shortDate(item.created_at);
          copy.append(title, date); button.append(number, copy);
          button.onclick = () => { state.version = item; renderVersions(); syncHash(); };
          list.appendChild(button);
        });
        $("#versionTitle").textContent = `Version ${v.version}`;
        $("#selectedBadge").hidden = !v.selected;
        const selectButton = $("#selectVersion"); selectButton.disabled = v.selected; selectButton.textContent = v.selected ? "Currently in use" : "Use this version";
        selectButton.onclick = selectCurrentVersion;
        $("#promptText").textContent = v.instructions;
        $("#copyPrompt").onclick = async () => { await navigator.clipboard.writeText(v.instructions); toast(`Copied ${p.key} v${v.version}`); };
        const words = v.instructions.trim() ? v.instructions.trim().split(/\s+/).length : 0;
        $("#detailStrip").innerHTML = `<span><strong>${v.instructions.length.toLocaleString()}</strong> characters</span><span><strong>${words.toLocaleString()}</strong> words</span><span>Created <strong>${shortDate(v.created_at)}</strong></span><span>By <strong id="versionAuthor"></strong></span>`;
        $("#versionAuthor").textContent = v.created_by || "Unknown";
        const notes = $("#notes"); notes.hidden = !v.change_notes; $("p", notes).textContent = v.change_notes || "";
        const holder = $("#placeholders"); holder.innerHTML = "";
        [...new Set(v.instructions.match(/{{\s*[A-Za-z0-9_.-]+\s*}}/g) || [])].forEach((token) => { const el = document.createElement("span"); el.className = "placeholder"; el.textContent = token; holder.appendChild(el); });
        renderLibrary();
      }

      async function selectCurrentVersion() {
        const p = state.current, v = state.version;
        if (!p || !v || v.selected) return;
        if (!confirm(`Use ${p.key} version ${v.version} for new application requests?`)) return;
        try {
          await api(`/v1/prompt-admin/prompts/${encodeURIComponent(p.key)}/selected-version`, { method: "POST", body: JSON.stringify({ version: v.version }) });
          toast(`Version ${v.version} is now in use`);
          await refreshCurrent(v.version);
        } catch (error) { toast(error.message, true); }
      }

      async function refreshCurrent(version) {
        const list = await api("/v1/prompt-admin/prompts"); state.prompts = list.prompts || [];
        state.current = await api(`/v1/prompt-admin/prompts/${encodeURIComponent(state.current.key)}`);
        state.version = state.current.versions.find((v) => v.version === version) || state.current.versions[0];
        renderPrompt(); syncHash();
      }

      function openNewVersion() {
        const p = state.current, source = state.version;
        const root = $("#modalRoot");
        root.innerHTML = `<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-head"><div><div class="eyebrow">${p.key}</div><h3 id="modalTitle">Create a new version</h3></div><span class="toolbar-spacer"></span><button class="icon-btn" id="closeModal">${icons.x}</button></div>
          <div class="modal-body"><div class="field"><label for="versionText">Prompt text <span id="charCount"></span></label><textarea id="versionText" spellcheck="false"></textarea></div><div class="field"><label for="versionNotes">What changed? <span>Optional</span></label><input id="versionNotes" maxlength="2000" placeholder="A short note for future reviewers"></div><div class="hint">Versions are immutable after creation. This creates the next version but does not automatically put it in use.</div></div>
          <div class="modal-foot"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveVersion">Create version</button></div>
        </div></div>`;
        const text = $("#versionText"); text.value = source?.instructions || "";
        const updateCount = () => $("#charCount").textContent = `${text.value.length.toLocaleString()} characters`;
        updateCount(); text.oninput = updateCount;
        const close = () => root.innerHTML = "";
        $("#closeModal").onclick = close; $("#cancelModal").onclick = close;
        $(".modal-wrap").onclick = (event) => { if (event.target.classList.contains("modal-wrap")) close(); };
        $("#saveVersion").onclick = async () => {
          const instructions = text.value, notes = $("#versionNotes").value;
          if (!instructions.trim()) return toast("Prompt text cannot be blank", true);
          const button = $("#saveVersion"); button.disabled = true; button.textContent = "Creating…";
          try {
            const created = await api(`/v1/prompt-admin/prompts/${encodeURIComponent(p.key)}/versions`, { method: "POST", body: JSON.stringify({ instructions, change_notes: notes }) });
            close(); toast(`Created ${p.key} version ${created.version}`); await refreshCurrent(created.version);
          } catch (error) { button.disabled = false; button.textContent = "Create version"; toast(error.message, true); }
        };
        setTimeout(() => text.focus(), 20);
      }

      function renderEmpty(message) { $("#workspace").innerHTML = `<div class="empty-state"><div><h2>Nothing to show</h2><p></p></div></div>`; $(".empty-state p").textContent = message; }
      function renderError(message) { $("#workspace").innerHTML = `<div class="error-state"><div><h2>Prompt Studio couldn’t load</h2><p></p><button class="btn">Try again</button></div></div>`; $(".error-state p").textContent = message; $(".error-state button").onclick = loadLibrary; }

      $("#search").oninput = (event) => { state.query = event.target.value; renderLibrary(); };
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") $("#modalRoot").innerHTML = ""; });
      loadLibrary();
    })();
  </script>
</body>
</html>
