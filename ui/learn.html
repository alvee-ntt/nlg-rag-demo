  .login-hero .statusbar { position: relative; z-index: 2; color: #fff; padding: 14px 18px 0; margin: 0; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .login-foot { margin-top: auto; padding: 24px 18px 22px; text-align: center; font-size: 11px; color: var(--muted); }
  /* Cream header for every screen that isn't a tab root (back/close + serif title). */
  .hdr.light { background: var(--cream); color: var(--ink); border-radius: 0; padding-bottom: 12px; }
  .hdr.light .statusbar { color: var(--ink); }
  .hdr.light .back { color: var(--ink); font-size: 18px; }
  .hdr.light .iconbtn { color: var(--ink); }
  .hdr.light .iconbtn:hover { background: var(--g050); }
  .hdr.light .pill { background: var(--g050); border-color: var(--g100); color: var(--g800); }
  .pill.streak { color: #ffd9a8; }
  .pill.streak span { color: #fff; }
  .hdr.light .pill.streak { color: var(--orange); }
  .hdr.light .pill.streak span { color: var(--g800); }
  .login-card { position: relative; z-index: 3; margin: -64px 18px 0; background: #fff; border-radius: 16px; padding: 20px 16px 18px; box-shadow: 0 12px 34px rgba(0,0,0,.16); text-align: left; }
  .login-card h1 { margin: 0 0 16px; font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -.1px; }
  .field { text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 7px; }
  .field .inwrap { position: relative; }
  .field input { width: 100%; padding: 12px 40px 12px 14px; border: 1px solid #d5dbd4; border-radius: 10px; background: #fff; color: var(--ink); font: inherit; font-size: 14px; outline: 0; }
  .field input::placeholder { color: #a9b0aa; }
  .field input:focus { border-color: var(--g700); box-shadow: 0 0 0 3px rgba(31,107,52,.12); }
  .field .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; padding: 6px; cursor: pointer; color: var(--muted); display: inline-flex; border-radius: 8px; }
  .field .eye svg { width: 18px; height: 18px; }
  .field .eye:hover { color: var(--g800); background: var(--g050); }
  .btn.solid { border-radius: 8px; background: #3f7d4b; box-shadow: none; padding: 13px 18px; font-size: 14.5px; }
  .btn.solid:hover { background: var(--g800); }
  .login-links { display: flex; justify-content: center; gap: 8px; margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .login-links button { background: none; border: 0; padding: 0; font: inherit; color: var(--ink-2); text-decoration: underline; cursor: pointer; }
  .login-err { min-height: 18px; margin: 12px 0 0; font-size: 13px; font-weight: 600; color: var(--red); }

  /* ===== Profile ===== */
  .level { background: var(--g900); color: #fff; border-radius: 14px; padding: 14px 14px 12px; }
  .level h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 15px; font-weight: 700; }
  .level .bar { height: 5px; background: rgba(255,255,255,.22); }
  .level .bar i { background: #cbe9a3; }
  .level .crit { font-size: 10.5px; opacity: .8; margin: 6px 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: rgba(255,255,255,.08); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  .tile .tl { font-size: 10.5px; opacity: .8; margin-bottom: 4px; white-space: nowrap; }
  .tile .tv { font-family: var(--serif); font-size: 20px; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  .tile .tv small { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: .3px; }
  .tile .up { color: #9be29c; } .tile .down { color: #ffb37a; }
  .skill { padding: 9px 0; cursor: pointer; }
  .skill .sr { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .skill .sr span { font-size: 11px; color: var(--muted); }
  .skill .bar { height: 5px; margin-top: 6px; background: #e3e7e1; }
  .skill.s0 .bar i { background: #46b5b0; } .skill.s1 .bar i { background: #7b4fbf; } .skill.s2 .bar i { background: #3e7bd6; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .setrow { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .setrow:first-child { border-top: 0; }
  .setrow:hover { background: #faf8f2; }
  .setrow .val { margin-left: auto; font-size: 11px; color: var(--g700); font-weight: 600; }
  .setrow svg { width: 14px; height: 14px; color: var(--muted); flex: none; }

  /* ===== Language picker ===== */
  .search { position: relative; margin: 4px 0 12px; }
  .search input { width: 100%; padding: 11px 12px 11px 36px; border: 1px solid #d5dbd4; border-radius: 10px; background: #fff; color: var(--ink); font: inherit; font-size: 14px; outline: 0; }
  .search input:focus { border-color: var(--g700); box-shadow: 0 0 0 3px rgba(31,107,52,.12); }
  .search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .langs { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .lang { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .lang:first-child { border-top: 0; }
  .lang:hover { background: #faf8f2; }
  .lang .nat { font-size: 11px; color: var(--muted); }
  .lang.on { background: #e8efe6; }
  .lang .ck { margin-left: auto; width: 18px; height: 18px; color: var(--g700); visibility: hidden; flex: none; }
  .lang.on .ck { visibility: visible; }
  .lang .ck svg { width: 18px; height: 18px; }
  .flag { width: 20px; height: 14px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08) inset; }

  /* ===== Prepare home ===== */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--g900); color: #fff; border-radius: 14px; padding: 14px 10px; text-align: center; margin-bottom: 4px; }
  .stats b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.1; }
  .stats span { font-size: 10.5px; opacity: .75; letter-spacing: .3px; }
  .stats div + div { border-left: 1px solid rgba(255,255,255,.14); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--serif); font-weight: 700; font-size: 14px; }
  .row-item .ic.avatar { background: var(--g700); }
  .row-item .ic.avatar.v1 { background: #2f7a3a; } .row-item .ic.avatar.v2 { background: #7a4b00; } .row-item .ic.avatar.v3 { background: #123f21; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; border-radius: 999px; padding: 2px 8px; background: var(--g050); color: var(--g800); }
  .tag.amber { background: var(--amber-bg); color: var(--amber); }
  .tag.red { background: #fde8e6; color: var(--red); }
  .tag.grey { background: #eeece6; color: var(--ink-2); }
  .link { background: none; border: 0; color: var(--g700); font: inherit; font-weight: 600; font-size: 12.5px; cursor: pointer; padding: 6px 0; }

  /* ===== Scenario brief ===== */
  .brief-hero { height: 120px; border-radius: 14px; position: relative; }
  .brief-hero .big { position: absolute; left: 16px; bottom: 10px; font-family: var(--serif); font-size: 44px; font-weight: 700; color: rgba(255,255,255,.95); text-shadow: 0 2px 10px rgba(0,0,0,.3); line-height: 1; }
  .kv { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 12px; }
  .kv div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
  .kv div:first-child { border-top: 0; }
  .kv b { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .brief-objective { margin: 12px 0 16px; padding: 13px 14px; border-radius: 12px; background: var(--g050); border: 1px solid #d7e5d5; }
  .brief-objective b { display: block; margin-bottom: 5px; color: var(--g800); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .brief-objective span { display: block; font-size: 13px; line-height: 1.45; color: var(--ink); }
  .brief-review-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 7px; }
  .brief-review-head h2 { margin: 0; font-family: var(--serif); font-size: 17px; }
  .brief-review-head button { padding: 0; background: none; border: 0; color: var(--g700); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .brief-review-copy { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .brief-details { display: grid; gap: 8px; }
  .brief-details details { overflow: hidden; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  .brief-details summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 13px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; color: var(--ink); }
  .brief-details summary::-webkit-details-marker { display: none; }
  .brief-details summary::after { content: "⌄"; color: var(--g700); font-size: 18px; font-weight: 400; line-height: 1; transition: transform .15s ease; }
  .brief-details details[open] summary { border-bottom: 1px solid var(--line); background: #fafcf8; }
  .brief-details details[open] summary::after { transform: rotate(180deg); }
  .brief-fields { margin: 0; }
  .brief-fields div { display: grid; grid-template-columns: 105px 1fr; gap: 10px; padding: 9px 13px; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.42; }
  .brief-fields div:first-child { border-top: 0; }
  .brief-fields dt { color: var(--muted); font-weight: 700; }
  .brief-fields dd { margin: 0; color: var(--ink); }
  .brief-context { padding: 12px 13px; font-size: 12.5px; line-height: 1.5; white-space: pre-line; color: var(--ink); }

  /* ===== Live call ===== */
  .status { display: inline-block; font-size: 10.5px; letter-spacing: 1.6px; font-weight: 700; color: var(--g800); background: var(--g050); border-radius: 999px; padding: 6px 14px; margin-top: 4px; }
  .status.off { color: var(--ink-2); background: #eeece6; }
  .status.warn { color: var(--amber); background: var(--amber-bg); }
  .knows { text-align: left; margin-top: 16px; }
  .tlines { text-align: left; margin-top: 8px; }
  .tlines .turn { grid-template-columns: 52px 1fr; }
  .tlines .turn.you b { color: var(--orange-2); }
  .tlines .turn i { font-style: normal; font-size: 10.5px; color: var(--muted); }
  .typebox { display: flex; gap: 8px; margin-top: 12px; }
  .typebox input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 13.5px; background: #fff; outline: 0; }
  .typebox input:focus { border-color: var(--g700); }
  .typebox button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--g700); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .typebox button svg { width: 16px; height: 16px; }
  .callctl { display: flex; justify-content: center; align-items: center; gap: 26px; padding: 8px 0 4px; }
  .callctl .cbtn { width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  .callctl .cbtn svg { width: 18px; height: 18px; }
  .callctl .cbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .callctl .cbtn.stop { width: 62px; height: 62px; border: 0; background: #e8ebe4; color: var(--g900); box-shadow: 0 0 0 6px #f1f3ee; }
  .callctl .cbtn.stop svg { width: 20px; height: 20px; }
  .callctl .cbtn.ai { border: 0; background: radial-gradient(circle at 32% 30%, #7ef0d0 0%, #3fb98a 26%, #2f9d55 46%, #57c98a 66%, #c8f26a 90%); box-shadow: 0 0 0 6px #eef2ea, 0 8px 18px rgba(18,63,33,.25); }
  .modal { background: var(--paper); border-radius: 20px; padding: 20px 18px 16px; margin: auto 18px; width: calc(100% - 36px); }
  .modal h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 18px; }
  .modal p { margin: 0 0 16px; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
  .modal .btn + .btn { margin-top: 8px; }
  .sheet-wrap.center { align-items: center; }
  .ask-log { max-height: 42dvh; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 10px; }
  .bubble { max-width: 88%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; white-space: pre-line; }
  .bubble.user { align-self: flex-end; background: var(--g700); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.ai { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.ai.pending { color: var(--muted); }
  .ask-input { display: flex; gap: 8px; margin-top: 8px; }
  .ask-input input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 13.5px; outline: 0; background: #fff; }
  .ask-input button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--orange); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .ask-input button svg { width: 16px; height: 16px; }

  /* ===== Ask Navigator (grounded Q&A over the source library) ===== */
  .orb { width: 20px; height: 20px; border-radius: 50%; flex: none; position: relative; display: inline-block;
    background: radial-gradient(circle at 32% 30%, #7ef0d0 0%, #3fb98a 26%, #2f9d55 46%, #57c98a 66%, #c8f26a 90%);
    box-shadow: 0 0 0 3px rgba(200,235,205,.55), 0 0 10px rgba(90,190,130,.45); }
  .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 70% 75%, rgba(255,255,255,.35), transparent 55%); }
  .orb.sm { width: 16px; height: 16px; box-shadow: 0 0 0 2px rgba(190,225,240,.5); }
  .tab.ask { transition: transform .12s ease; }
  .tab.ask:active { transform: scale(.9); }
  .tab.ask .orb { margin: 1px 0; }
  .nav-h { display: flex; align-items: center; gap: 10px; }
  .nav-h .spacer { flex: 1; }
  .nav-ib { background: none; border: 0; color: var(--muted); padding: 4px 8px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .nav-ib:hover { background: var(--g050); color: var(--g800); }
  .nav-ib.arm { color: var(--red); }
  .nav-ib svg { width: 15px; height: 15px; }
  .nav-log .nturn .hint .act { color: var(--g700); font-weight: 600; cursor: pointer; margin-left: 10px; }
  .nav-log .nturn.failed .bubble { border-color: #f2c9c5; color: var(--ink-2); }
  .nav-log { max-height: 50dvh; }
  .nav-log .nturn { display: flex; flex-direction: column; align-self: flex-start; max-width: 88%; gap: 4px; }
  .nav-log .nturn .bubble { max-width: none; }
  .nav-log .nturn.ai .bubble { cursor: pointer; }
  .nav-log .nturn .hint { font-size: 10.5px; color: var(--muted); padding-left: 6px; }
  .nsrc-list { display: none; flex-direction: column; gap: 6px; padding: 2px 0 2px 6px; }
  .nsrc-list.open { display: flex; }
  .nsrc { background: var(--mint); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; cursor: pointer; }
  .nsrc-top { display: flex; align-items: baseline; gap: 8px; }
  .nsrc-cite { font-weight: 600; color: var(--g800); flex: 1; min-width: 0; line-height: 1.35; }
  .nsrc-sim { font-size: 11px; color: var(--muted); flex: none; }
  .nsrc-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .nsrc-preview { display: none; margin-top: 6px; color: var(--ink-2); line-height: 1.45; white-space: pre-wrap; border-top: 1px dashed var(--line); padding-top: 6px; }
  .nsrc.open .nsrc-preview { display: block; }

  /* ===== Report ===== */
  .outcome { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
  .outcome .o-lbl { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .outcome .o-val { font-family: var(--serif); font-size: 17px; font-weight: 700; margin-top: 2px; }
  .outcome .o-meta { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.5; }
  .fact { display: grid; grid-template-columns: 8px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .fact i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
  .fact.supported i { background: var(--g600); } .fact.unsupported i { background: var(--red); } .fact.not_enough_context i { background: var(--amber); }
  .fact .q { font-style: italic; color: var(--ink-2); }
  .fact .v { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-top: 2px; }
  .menu-list { display: flex; flex-direction: column; gap: 4px; }
  .menu-list button { text-align: left; background: none; border: 0; font: inherit; font-size: 14px; padding: 12px 6px; border-top: 1px solid var(--line); cursor: pointer; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .menu-list button svg { width: 18px; height: 18px; color: var(--g700); }

  /* ===== Home ===== */
  .hdr.home { padding-bottom: 48px; }
  .askbar { display: flex; align-items: center; gap: 10px; margin: -44px 0 0; background: #fff; border-radius: 14px; padding: 7px 7px 7px 14px; box-shadow: 0 10px 26px rgba(18,63,33,.16); position: relative; z-index: 3; }
  .askbar > svg { width: 18px; height: 18px; color: var(--g700); flex: none; }
  .askbar input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 13.5px; background: transparent; color: var(--ink); }
  .askbar input::placeholder { color: #9aa19b; }
  .askbar .mic { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--g700); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .askbar .mic svg { width: 15px; height: 15px; }
  .h2row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
  .h2row .h2 { margin: 0; }
  .seeall { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--g700); cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
  .seeall svg { width: 11px; height: 11px; }
  .daily { background: var(--g900); color: #fff; border-radius: 14px; padding: 12px 14px; margin-top: 16px; cursor: pointer; position: relative; overflow: hidden; }
  .daily::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 9px); pointer-events: none; }
  .daily .top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; opacity: .92; position: relative; z-index: 1; }
  .daily .ttl { font-family: var(--serif); font-size: 15.5px; font-weight: 700; line-height: 1.3; margin: 10px 46px 8px 0; position: relative; z-index: 1; }
  .daily .dur { font-size: 11px; opacity: .8; position: relative; z-index: 1; padding-right: 46px; }
  .daily .play { position: absolute; right: 14px; bottom: 12px; width: 26px; height: 26px; border-radius: 50%; background: #9be29c; color: var(--g900); display: grid; place-items: center; z-index: 1; }
  .daily .play svg { width: 11px; height: 11px; margin-left: 1px; }
  .row-item.plain { grid-template-columns: 1fr auto; }
  .row-item .chev.bare { background: none; color: var(--ink); }
  .row-item .chev.bare svg { width: 12px; height: 12px; }
  .row-item .chev.play svg { width: 9px; height: 9px; margin-left: 1px; }
  .row-item .sub.done { color: var(--g700); }
  .row-item .sub.due { color: var(--amber); }
  /* Coach mock-up: call rows with a right-hand time/date column and a plain chevron */
  .callrow { display: grid; grid-template-columns: 34px 1fr auto 14px; align-items: center; gap: 11px; padding: 12px 12px; border-top: 1px solid var(--line); }
  .callrow:first-child { border-top: 0; }
  .callrow .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--g050); color: var(--g700); display: grid; place-items: center; }
  .callrow .ic svg { width: 17px; height: 17px; }
  .callrow .nm { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .callrow .who { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .callrow .rt { text-align: right; }
  .callrow .rt .d1 { font-size: 12.5px; font-weight: 600; color: var(--g800); }
  .callrow .rt .d2 { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .callrow .gt { color: var(--muted); display: grid; place-items: center; }
  .callrow .gt svg { width: 12px; height: 12px; }
  .tile.tall { min-height: 80px; display: flex; flex-direction: column; }
  .tile.tall .tl { white-space: normal; line-height: 1.3; }
  .tile.tall .tv { margin-top: auto; font-size: 18px; }
  .tile.tall .tv svg { width: 14px; height: 14px; }
  .tile.tall .tv small { font-size: 9.5px; opacity: .8; }
  .pscore { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .pscore h3 { margin: 0; }
  .pscore .score { font-family: var(--serif); font-size: 22px; font-weight: 700; color: #cbe9a3; white-space: nowrap; flex: none; }

  /* ===== Video library (placeholder rows until a video source is connected) ===== */
  .vhero { height: 96px; border-radius: 12px; background: var(--g050); border: 1px solid var(--g100); display: grid; place-items: center; color: var(--g700); margin-bottom: 12px; }
  .vhero svg { width: 40px; height: 40px; }
  .vrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 10px; cursor: pointer; }
  .vrow .thumb { height: 64px; border-radius: 8px; position: relative; display: grid; place-items: center; color: #fff; }
  .vrow .thumb .pl { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--g900); display: grid; place-items: center; position: relative; z-index: 1; }
  .vrow .thumb .pl svg { width: 12px; height: 12px; margin-left: 1px; }
  .vrow .thumb .dur { position: absolute; right: 6px; bottom: 5px; font-size: 9.5px; font-weight: 700; background: rgba(0,0,0,.55); border-radius: 4px; padding: 1px 5px; z-index: 1; }
  .vrow .ttl { font-family: var(--serif); font-size: 13px; font-weight: 700; line-height: 1.25; }
  .vrow .sub { font-size: 11px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* ===== Ask Navigator chat (full page, and the in-call sheet) ===== */
  .chat { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 10px 18px 0; }
  .chat-log { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 0 10px; scrollbar-width: none; }
  .chat-log::-webkit-scrollbar { display: none; }
  .chat .bubble.user { align-self: flex-end; max-width: 84%; }
  .ai-row { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; max-width: 92%; }
  .ai-row .orb { margin-top: 5px; }
  .ai-row .bubble.ai { max-width: none; border-top-left-radius: 4px; border-bottom-left-radius: 14px; }
  .ai-row.failed .bubble.ai { border-color: #f2c9c5; color: var(--ink-2); }
  .thumbs { display: flex; align-items: center; gap: 2px; padding: 3px 0 0 4px; }
  .thumbs button { background: none; border: 0; padding: 3px; color: var(--muted); cursor: pointer; border-radius: 6px; display: inline-flex; }
  .thumbs button:hover { background: var(--g050); color: var(--g800); }
  .thumbs button.on { color: var(--g700); }
  .thumbs svg { width: 14px; height: 14px; }
  .thumbs .act { font-size: 11px; color: var(--g700); font-weight: 600; cursor: pointer; margin-left: 8px; }
  .chat-foot { position: sticky; bottom: 0; background: var(--cream); padding: 6px 0 12px; }
  .chat-foot .chips { margin: 0 0 8px; }
  .chat-input { display: flex; align-items: center; gap: 8px; }
  .chat-input .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; margin: 0; }
  .chat-input .field:focus-within { border-color: var(--g700); }
  .chat-input input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 13.5px; background: transparent; padding: 6px 0; }
  .chat-input .micb { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--g050); color: var(--g700); display: grid; place-items: center; cursor: pointer; flex: none; }
  .chat-input .micb.on { background: var(--orange); color: #fff; animation: pulse 1.2s infinite; }
  .chat-input .micb svg { width: 14px; height: 14px; }
  .chat-input .sendb { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--g700); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .chat-input .sendb svg { width: 16px; height: 16px; }
  .sheet .chat { padding: 0; }
  .sheet .chat-log { max-height: 40dvh; flex: none; }
  .sheet .chat-foot { background: var(--paper); padding-bottom: 4px; }
  .nsrc-list { padding-left: 4px; }

  /* ===== Live call ===== */
  .call { text-align: center; padding-top: 26px; display: flex; flex-direction: column; align-items: center; }
  .call > .wave, .call > .tpanel, .call > .typebox, .call > .foot { align-self: stretch; }
  .call > .foot.flush { margin-top: auto; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 56px; margin: 20px 0 12px; }
  .wave i { width: 3px; border-radius: 3px; background: #b9c8b9; height: 16%; }
  .wave.listening i { animation: wv 1.15s ease-in-out infinite; animation-delay: calc(var(--i) * -.07s); }
  .wave.speaking i { background: var(--g600); animation: wv .55s ease-in-out infinite; animation-delay: calc(var(--i) * -.045s); }
  .wave.thinking i { background: #cdd7cd; animation: wv 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * -.1s); }
  .wave.paused i, .wave.text i { animation: none; height: 12%; }
  @keyframes wv { 0%, 100% { height: 16%; } 50% { height: calc(28% + var(--h) * 1%); } }
  .switchrow { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 6px; font: inherit; font-size: 11.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-radius: 8px; }
  .switch { width: 34px; height: 20px; border-radius: 999px; background: #d3d7d0; position: relative; transition: background .15s ease; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s ease; }
  .switch.on { background: var(--g700); }
  .switch.on::after { left: 16px; }
  .tpanel { margin: 12px -18px 0; background: #eef0ea; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 18px; max-height: 230px; overflow: auto; text-align: left; }
  .tpanel[hidden] { display: none; }
  .tpanel .tl { padding: 7px 0; }
  .tpanel .who { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
  .tpanel .txt { font-size: 12.5px; line-height: 1.45; color: var(--ink); margin-top: 2px; }
  .tpanel .empty { padding: 10px 0; }
  .call .typebox { margin-top: 14px; }
  .clock { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }
  .foot.flush { bottom: 0; }
  .modal .two { display: flex; gap: 10px; }
  .modal .two .btn { margin: 0; border-radius: 8px; padding: 11px 14px; }
  .modal .two .btn.ghost { border-width: 1px; }

  /* ===== Feedback ===== */
  .fbgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fbgrid.scroll { display: flex; overflow-x: auto; margin: 0 -18px; padding: 0 18px 6px; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .fbgrid.scroll::-webkit-scrollbar { display: none; }
  .fbgrid.scroll .fbcard { flex: 0 0 150px; scroll-snap-align: start; }
  .fbcard { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fbcard b { font-size: 13px; line-height: 1.3; color: var(--ink); }
  .fbcard p { margin: 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
  .fbcard .badge { align-self: flex-start; margin-top: auto; font-size: 10.5px; font-weight: 600; background: var(--g050); color: var(--g800); border-radius: 6px; padding: 3px 7px; }
  .fbcard .addmix { margin-top: auto; align-self: flex-end; background: none; border: 0; padding: 2px 0 0; font: inherit; font-size: 10.5px; font-weight: 700; color: var(--g700); cursor: pointer; }
  .fbcard.empty-card { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
  .toast.act { pointer-events: auto; }
  .toast .undo { margin-left: 12px; color: #9be29c; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="phone">
  <div id="apiBad" class="api-bad" hidden>Can't reach the RAG API. Is it running?</div>
  <div id="view"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  // --- Config -----------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const API = params.get("api") || (location.pathname.startsWith("/app") ? "" : "http://localhost:8000");

  const I = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
    audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 0116 0v3"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/></svg>',
    article: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9.5 12h6M9.5 16h6"/></svg>',
    flashcards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M8 4h11a2 2 0 012 2v11"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
    skipb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8H9"/><path d="M11 1.5L8 4l3 2.5"/><text x="12" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg>',
    skipf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-8-8h3"/><path d="M13 1.5L16 4l-3 2.5"/><text x="12" y="15.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg>',
    flip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0115.5-6.3L21 8"/><path d="M21 3v5h-5"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
    learn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h6a3 3 0 013 3v12a2 2 0 00-2-2H3zM21 5h-6a3 3 0 00-3 3v12a2 2 0 012-2h7z"/></svg>',
    prepare: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>',
    coach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-6v14L3 13z"/><path d="M17 8a4 4 0 010 8M7 13v5a2 2 0 004 0v-4"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.8 10.8 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4.1M6.6 6.6C3.7 8.6 2 12 2 12s3.5 7 10 7a9.7 9.7 0 004.3-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    chevd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    thumbUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9z"/><path d="M7 11l4-7a2 2 0 012 2v4h5a2 2 0 012 2.3l-1 6a2 2 0 01-2 1.7H7"/></svg>',
    thumbDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(180 12 12)"><path d="M7 11v9H4v-9z"/><path d="M7 11l4-7a2 2 0 012 2v4h5a2 2 0 012 2.3l-1 6a2 2 0 01-2 1.7H7"/></g></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 3H4.2A1.2 1.2 0 003 4.3 16.7 16.7 0 0019.7 21a1.2 1.2 0 001.3-1.2v-2.4a1.2 1.2 0 00-1-1.2l-2.7-.5a1.2 1.2 0 00-1.1.4l-1 1a13 13 0 01-5.7-5.7l1-1a1.2 1.2 0 00.4-1.1l-.5-2.7a1.2 1.2 0 00-1.2-1z"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0111 0"/><path d="M16 5.2a3.2 3.2 0 010 5.9M17.5 20a5.5 5.5 0 00-3-4.9"/></svg>',
    stopSq: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
    bookmarkOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  };
  const KIND_LABEL = { audio: "Audio", article: "Article", flashcards: "Flashcards" };
  const LENGTH_LABELS = { audio: [["short", "Short", "5 mins"], ["long", "Long", "10 mins"]],
                          article: [["short", "Short", "5 min read"], ["long", "Long", "10 min read"]],
                          flashcards: [["short", "Short", "10 cards"], ["long", "Long", "20 cards"]] };

  // --- Tiny helpers -------------------------------------------------------------
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mmss = (s) => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const mins = (s) => `${Math.max(1, Math.round((s || 0) / 60))} min`;
  const store = {
    get(k, d) { try { const v = localStorage.getItem("salesdj." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("salesdj." + k, JSON.stringify(v)); } catch {} },
  };
  const toastEl = $("#toast"); let toastT;
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.remove("act"); toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2200); };
  // A toast with one action ("Undo"), kept up a little longer.
  const toastAction = (msg, label, fn) => {
    toastEl.innerHTML = `${esc(msg)}<span class="undo">${esc(label)}</span>`;
    toastEl.classList.add("show", "act");
    toastEl.querySelector(".undo").onclick = () => { fn(); toastEl.classList.remove("show", "act"); };
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show", "act"), 4500);
  };
  const coverClass = (id) => ["", "v1", "v2", "v3"][(Number(id) || 0) % 4];

  async function api(path, opts = {}) {
    const r = await fetch(API + path, { headers: { "Content-Type": "application/json" }, cache: "no-store", credentials: "same-origin", ...opts });
    $("#apiBad").hidden = true;
    if (r.status === 401 && !path.startsWith("/v1/auth/")) { requireLogin(); throw new Error("Sign in required"); }
    if (r.status === 204) return null;
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || `${r.status} ${r.statusText}`);
    return data;
  }

  // --- Router -----------------------------------------------------------------
  const view = $("#view");
  let cleanup = null;
  let status = null;
  let curriculum = null;
  const STAGES = {
    1: { name: "Start here", blurb: "The essentials before your first FlexLife conversation." },
    2: { name: "Go deeper", blurb: "How the policy really works, still in plain English." },
    3: { name: "Sell it", blurb: "Conversations, objections, closing, and follow-up." },
  };
  const markViewed = (id) => { const v = store.get("viewed", {}); if (!v[id]) { v[id] = Date.now(); store.set("viewed", v); } };

  // One list row for a mix (or a curriculum item that has no mix yet).
  function mixRow(m, fallback, done = false) {
    if (!m) return `<div class="row-item busy" style="opacity:.55;cursor:default"><div class="ic">${I[fallback.kind]}</div><div><div class="ttl">${esc(fallback.prompt)}</div><div class="sub">${KIND_LABEL[fallback.kind]} · not generated yet</div></div><div></div></div>`;
    const st = m.status;
    const cls = (st === "failed" ? "failed" : (st === "ready" ? "" : "busy")) + (done ? " done" : "");
    const sub = st === "ready" ? `${KIND_LABEL[m.kind]} · ${m.kind === "flashcards" ? m.length_label : mins(m.duration_seconds)}` :
                st === "failed" ? "Failed · tap to retry" : `<span class="spin" style="width:11px;height:11px;border-width:1.5px"></span> Generating…`;
    return `<div class="row-item ${cls}" data-go="/mix/${m.id}">
      <div class="ic">${I[m.kind]}</div>
      <div><div class="ttl">${esc(m.title)}</div><div class="sub">${sub}</div></div>
      <div class="chev play">${st === "ready" ? I.play : ""}</div></div>`;
  }

  // A small route stack so detail screens return to wherever they were opened from
  // (a mix opened from Home goes back to Home, the same mix opened from Learn to Learn).
  const navStack = [];
  const trackRoute = (now) => {
    if (navStack[navStack.length - 1] === now) return;
    if (navStack.length >= 2 && navStack[navStack.length - 2] === now) { navStack.pop(); return; }
    navStack.push(now); if (navStack.length > 30) navStack.shift();
  };
  const setCurrentRoute = (h) => { history.replaceState(null, "", "#" + h); navStack[navStack.length - 1] = h; };
  const goBack = (fallback) => {
    const prev = navStack.length >= 2 ? navStack[navStack.length - 2] : null;
    go(prev && !/^\/(login|prepare\/session)/.test(prev) ? prev : fallback);
  };

  function route() {
    if (cleanup) { try { cleanup(); } catch {} cleanup = null; }
    view.scrollTop = 0; window.scrollTo(0, 0);
    const now = location.hash.replace(/^#/, "") || "/";
    trackRoute(now);
    const hash = now.replace(/^\//, "").split("?")[0];
    const [seg, id, sub] = hash.split("/");
    if (seg === "login") return renderLogin();
    // Keep the requested SPA page through sign-in. This makes direct visits to
    // /prepare (and refreshes on deep links) return to the page the agent chose.
    if (!me.authenticated) {
      const requested = location.hash.replace(/^#/, "") || "/";
      afterLogin = requested.startsWith("/") ? requested : `/${requested}`;
      return renderLogin();
    }
    if (seg === "learn") {
      if (id === "mixes") return renderMixList();
      if (id === "videos" && sub) return renderVideos(decodeURIComponent(sub));
      return renderLearn();
    }
    if (seg === "ask") {
      // Ask is a pull-up sheet now, not a page: open it over Home and normalise the URL.
      const q = new URLSearchParams(now.split("?")[1] || "");
      renderHome();
      history.replaceState(null, "", "#/"); navStack[navStack.length - 1] = "/";
      openNavigator({ q: q.get("q"), voice: q.get("voice") });
      return;
    }
    if (seg === "create") return renderCreate();
    if (seg === "profile") {
      if (id === "language" && sub) return renderLanguagePicker(sub);
      return renderProfile();
    }
    if (seg === "mix" && id) return renderMix(Number(id));
    if (seg === "path" && id) return renderPath(Number(id));
    if (seg === "prepare") {
      if (id === "create") return renderPrepareCreate();
      if (id === "scenario" && sub) return renderScenario(decodeURIComponent(sub));
      if (id === "session" && sub) return renderSession(sub);
      if (id === "report" && sub) return renderReport(sub);
      return renderPrepare();
    }
    if (seg === "coach") return renderCoach();
    return renderHome();
  }
  window.addEventListener("hashchange", route);
  const go = (h) => { location.hash = h; };

  function tabbar(active) {
    const tb = $("#tabbar"); tb.hidden = false;
    const tab = (k, h, ic, l, title = "") => `<button class="tab ${k} ${active === k ? "on" : ""}" data-go="${h}" title="${title}"><span class="ico">${ic}</span><span>${l}</span></button>`;
    tb.innerHTML = tab("home", "/", I.home, "Home") + tab("learn", "/learn", I.learn, "Learn") + tab("prepare", "/prepare", I.prepare, "Prepare") +
      tab("coach", "/coach", I.coach, "Coach", "Your week in review, upcoming and completed calls") +
      `<button class="tab ask" id="askTab" title="Ask Navigator a question about the source library"><span class="ico"><span class="orb"></span></span><span>Ask</span></button>`;
    tb.querySelectorAll("[data-go]").forEach((el) => (el.onclick = () => go(el.dataset.go)));
    tb.querySelector("#askTab").onclick = () => openNavigator();
  }

  // --- Ask Navigator: grounded chat over the corpus via POST /v1/chat -------------
  // One chat widget serves the full-screen Ask page and the in-call sheet. The page's
  // thread survives tab switches and reloads (localStorage, capped).
  const NAV_KEY = "navLog", NAV_MAX = 40;
  const navLog = (store.get(NAV_KEY, []) || []).filter((m) => m && !m.pending);
  const saveNav = () => { if (navLog.length > NAV_MAX) navLog.splice(0, navLog.length - NAV_MAX); store.set(NAV_KEY, navLog.filter((m) => !m.pending)); };
  const NAV_CHIPS = [
    ["What do I ask next?", "A prospect just told me their spouse's employer already covers them. What should I ask next?"],
    ["Living benefits", "How should I describe living benefits, and what wording is approved?"],
    ["FlexLife caps", "How do caps and floors work on FlexLife, and what can I promise?"],
  ];
  const NAV_INTRO = "Ask me anything about the products, riders, or approved wording. I only answer from the source library, and you can open the sources under any answer.";

  function srcHtml(s, i) {
    const pct = Math.round((s.similarity || 0) * 100);
    const file = String(s.blob_name || "").split("/").pop().replace(/\.[a-z0-9]+$/i, "");
    // Citations look like "path/file.pdf | p.10 | Doc > Section > Heading": show the heading trail as the title.
    const parts = String(s.citation || "").split(" | ").map((x) => x.trim()).filter(Boolean);
    const title = parts.length > 1 ? parts[parts.length - 1] : (parts[0] || file);
    const meta = [file, s.page != null ? `page ${s.page}` : null, s.zone && s.zone !== "body" ? s.zone : null].filter(Boolean).join(" · ");
    return `<div class="nsrc" data-i="${i}"><div class="nsrc-top"><span class="nsrc-cite">${esc(title)}</span><span class="nsrc-sim">${pct}%</span></div>
      <div class="nsrc-meta">${esc(meta)}</div><div class="nsrc-preview">${esc(s.preview || "")}</div></div>`;
  }

  // opts: { log, send(question, history) -> {text, sources?, follow_ups?}, chips?, intro?, placeholder?, pendingText?, persist? }
  function mountChat(root, opts) {
    const log = opts.log;
    root.innerHTML = `<div class="chat-log"></div><div class="chat-foot"><div class="chips"></div>
      <div class="chat-input"><div class="field"><input placeholder="${esc(opts.placeholder || "Ask a question…")}" autocomplete="off" maxlength="1000"><button class="micb" title="Speak your question">${I.mic}</button></div><button class="sendb" title="Send">${I.send}</button></div></div>`;
    const logEl = root.querySelector(".chat-log"), chipsEl = root.querySelector(".chips"), input = root.querySelector("input"), micb = root.querySelector(".micb");
    const save = () => { if (opts.persist) opts.persist(); };
    const paint = () => {
      const items = log.length ? log : [{ who: "ai", text: opts.intro || NAV_INTRO, intro: true }];
      logEl.innerHTML = items.map((m, i) => {
        if (m.who === "user") return `<div class="bubble user">${esc(m.text)}</div>`;
        const n = (m.sources || []).length;
        const tools = m.pending || m.intro ? "" : m.failed
          ? `<div class="thumbs"><span class="act" data-act="retry" style="margin-left:0">Try again</span></div>`
          : `<div class="thumbs"><button data-act="up" class="${m.vote === "up" ? "on" : ""}" title="Helpful">${I.thumbUp}</button><button data-act="down" class="${m.vote === "down" ? "on" : ""}" title="Not helpful">${I.thumbDown}</button>${n ? `<span class="act" data-act="src">${m.open ? "Hide sources" : `Sources (${n})`}</span>` : ""}<span class="act" data-act="copy">Copy</span></div>`;
        return `<div class="ai-row${m.failed ? " failed" : ""}" data-i="${i}"><span class="orb sm"></span><div><div class="bubble ai${m.pending ? " pending" : ""}">${esc(m.text)}</div>${tools}<div class="nsrc-list${m.open ? " open" : ""}">${(m.sources || []).map(srcHtml).join("")}</div></div></div>`;
      }).join("");
      logEl.scrollTop = logEl.scrollHeight;
    };
    const paintChips = () => {
      const last = [...log].reverse().find((m) => m.who === "ai" && !m.pending);
      const items = last && last.follow_ups && last.follow_ups.length ? last.follow_ups.map((q) => [q, q]) : (opts.chips || NAV_CHIPS);
      chipsEl.innerHTML = items.map(([l, q]) => `<span class="chip" data-q="${esc(q)}">${esc(l)}</span>`).join("");
      chipsEl.querySelectorAll(".chip").forEach((c) => (c.onclick = () => send(c.dataset.q)));
    };
    const send = async (q) => {
      q = (q || "").trim(); if (!q) return;
      // Last few finished turns, oldest first, so follow-ups like "and the floor?" make sense.
      const history = log.filter((m) => !m.pending && !m.failed).slice(-8).map((m) => ({ role: m.who === "user" ? "user" : "assistant", text: m.text }));
      log.push({ who: "user", text: q });
      const pending = { who: "ai", text: opts.pendingText || "Checking the source library…", pending: true }; log.push(pending); paint();
      try { Object.assign(pending, await opts.send(q, history)); }
      catch (err) { pending.text = "I couldn't reach the source library just now."; pending.failed = true; pending.question = q; toast(err.message || "Navigator unavailable"); }
      pending.pending = false; paint(); paintChips(); save();
    };
    logEl.onclick = (e) => {
      const src = e.target.closest(".nsrc");
      if (src) { src.classList.toggle("open"); return; }
      const row = e.target.closest(".ai-row"); if (!row) return;
      const i = Number(row.dataset.i), m = log[i]; if (!m || m.pending) return;
      const act = e.target.closest("[data-act]"); if (!act) return;
      const a = act.dataset.act;
      if (a === "copy") (navigator.clipboard ? navigator.clipboard.writeText(m.text) : Promise.reject()).then(() => toast("Answer copied"), () => toast("Couldn't copy"));
      else if (a === "src") { m.open = !m.open; paint(); }
      else if (a === "up" || a === "down") { m.vote = m.vote === a ? null : a; paint(); save(); if (m.vote) toast(m.vote === "up" ? "Thanks, noted" : "Thanks, I'll do better"); }
      else if (a === "retry") {
        const hasQ = log[i - 1] && log[i - 1].who === "user";
        const q = m.question || (hasQ ? log[i - 1].text : "");
        log.splice(hasQ ? i - 1 : i, hasQ ? 2 : 1); send(q);
      }
    };
    const submit = () => { const q = input.value; input.value = ""; send(q); };
    root.querySelector(".sendb").onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
    // Voice: Web Speech API where available; the recognised question sends itself.
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
    const mic = () => {
      if (!SR) return toast("Voice input isn't available in this browser");
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = "en-US"; rec.interimResults = true;
      rec.onresult = (e) => { input.value = Array.from(e.results).map((r) => r[0].transcript).join(" "); };
      rec.onend = () => { rec = null; micb.classList.remove("on"); if (input.value.trim()) submit(); };
      rec.onerror = () => toast("Couldn't hear that. Try again.");
      micb.classList.add("on"); rec.start();
    };
    micb.onclick = mic;
    paint(); paintChips();
    return { send, mic, paint, focus: () => setTimeout(() => input.focus(), 50),
      clear: () => { log.length = 0; save(); paint(); paintChips(); },
      destroy: () => { if (rec) { try { rec.stop(); } catch {} } } };
  }

  // Ask Navigator: a pull-up bottom sheet over the current screen. Both the Ask tab and the
  // Home search bar open it. One thread, persisted across opens and reloads (localStorage).
  // opts: { q?: initial question to send, voice?: start voice input }.
  function openNavigator(opts = {}) {
    if ($(".sheet-wrap.nav")) return;
    const w = document.createElement("div"); w.className = "sheet-wrap nav";
    w.innerHTML = `<div class="sheet"><div class="grab"></div><div class="sheet-h nav-h"><span class="orb sm"></span>Ask Navigator<span class="spacer"></span><button class="nav-ib" id="navClear" title="Clear chat">${I.trash}Clear</button><button class="nav-ib" id="navClose" title="Close">${I.x}</button></div><div class="chat" id="navChat"></div></div>`;
    $("#phone").appendChild(w);
    const chat = mountChat(w.querySelector("#navChat"), { log: navLog, persist: saveNav, chips: NAV_CHIPS, intro: NAV_INTRO,
      send: async (message, history) => {
        const d = await api("/v1/chat", { method: "POST", body: JSON.stringify({ message, history, limit: 6 }) });
        return { text: d.answer || "The sources don't cover that.", sources: d.sources || [], follow_ups: d.follow_ups || [] };
      } });
    const close = () => { chat.destroy(); w.remove(); };
    w.onclick = (e) => { if (e.target === w) close(); };
    w.querySelector("#navClose").onclick = close;
    // Clear is two taps: the first arms it ("Clear?") for a few seconds, the second wipes the thread.
    const clearBtn = w.querySelector("#navClear"); let armT = null;
    const disarm = () => { clearBtn.classList.remove("arm"); clearBtn.innerHTML = `${I.trash}Clear`; clearTimeout(armT); armT = null; };
    clearBtn.onclick = () => {
      if (!navLog.length) { toast("Nothing to clear"); return; }
      if (!armT) { clearBtn.classList.add("arm"); clearBtn.innerHTML = `${I.trash}Clear?`; armT = setTimeout(disarm, 3500); return; }
      disarm(); chat.clear(); toast("Chat cleared"); chat.focus();
    };
    if (opts.q) chat.send(opts.q);
    else if (opts.voice) chat.mic();
    else chat.focus();
  }

  const STATUSBAR = `<div class="statusbar"><span>9:41</span><span class="sig">▂▄▆ ᯤ ▮</span></div>`;
  function header(inner, cls = "") { return `<div class="hdr ${cls}">${STATUSBAR}<div class="hdr-row">${inner}</div></div>`; }
  // Cream header for every screen that isn't a tab root: back (or close) + serif title.
  function lightHeader(title, extra = "", o = {}) {
    return `<div class="hdr light">${STATUSBAR}<div class="hdr-row"><button class="back" id="back" title="${o.close ? "Close" : "Back"}">${o.close ? I.x : I.back}${o.orb ? `<span class="orb sm"></span>` : ""}<span>${esc(title)}</span></button><span class="spacer"></span>${extra}</div></div>`;
  }
  const backHeader = (title, extra = "") => lightHeader(title, extra);
  const closeHeader = (title, extra = "") => lightHeader(title, extra, { close: true });
  const streakPill = (n) => `<span class="pill streak" id="streakPill">${I.flame.replace("<svg", '<svg width="12" height="12"')}<span>${n}</span></span>`;
  const setStreak = (n) => { store.set("streak", n); const el = $("#streakPill span:last-child"); if (el) el.textContent = n; };
  const loadStreak = () => api("/v1/roleplay/history?limit=1").then((h) => setStreak((h.stats || {}).streak_days || 0)).catch(() => {});

  // =============================================================================
  // Home: today's picks, a daily roleplay, coach follow-ups, and progress
  // =============================================================================
  // Coach follow-ups are demo data for now: there is no coach/CRM backend yet, so the
  // three items match the Coach mock-up and their done state lives in localStorage.
  const FOLLOWUPS = [["recap-gomez", "Send recap to Amanda Gomez"], ["followup-kowalski", "Follow up with David Kowalski", "Due soon"], ["review-okafor", "Schedule review call with Sandra Okafor"]];
  const displayName = () => { const u = (me.username || "").trim(); if (!u || /^(user|admin|demo|agent|test|guest)$/i.test(u)) return ""; const n = u.split(/[._\s-]+/)[0]; return n.charAt(0).toUpperCase() + n.slice(1); };
  const mixLen = (m) => (m.kind === "flashcards" ? m.length_label : mmss(m.duration_seconds));
  function mixCard(m, progress = {}) {
    const p = progress[m.id]; const pct = p && p.duration ? Math.min(100, (p.position / p.duration) * 100) : 0;
    return `<div class="rec" data-go="/mix/${m.id}"><div class="band"><span class="lab">${I[m.kind]}${KIND_LABEL[m.kind]}</span></div>
      <div class="body"><div class="ttl">${esc(m.title)}</div><div class="meta"><span>${mixLen(m)}</span>${m.kind === "audio" && pct ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</div></div></div>`;
  }
  function scenarioCard(c) {
    return `<div class="rec" data-go="/prepare/scenario/${esc(c.persona_id)}"><div class="band"><span class="lab">${I.prepare}Roleplay</span></div>
      <div class="body"><div class="ttl">${esc(c.name)}${c.age ? `, ${c.age}` : ""}</div><div class="sub">${esc(c.scenario_title || "Practice call")}</div><div class="meta"><span>Practice call</span></div></div></div>`;
  }

  async function renderHome() {
    tabbar("home");
    const name = displayName();
    view.innerHTML = header(`<h1>${esc(name ? `Welcome, ${name}!` : "Welcome back!")}</h1><span class="spacer"></span>${streakPill(store.get("streak", 0))}<button class="iconbtn" id="menuBtn" title="Menu">${I.menu}</button>`, "home") +
      `<main id="home"><div class="askbar">${I.spark}<input id="homeAsk" placeholder="What do you need help with?" autocomplete="off" maxlength="500"><button class="mic" id="homeMic" title="Ask by voice">${I.mic}</button></div>
       <div id="homeBody"><div class="empty" style="margin-top:20px"><span class="spin"></span></div></div></main>`;
    $("#menuBtn").onclick = openMenu;
    const askEl = $("#homeAsk");
    const openAskSheet = (voice) => { const q = askEl.value.trim(); askEl.value = ""; openNavigator(q ? { q } : voice ? { voice: true } : {}); };
    askEl.onkeydown = (e) => { if (e.key === "Enter") openAskSheet(false); };
    $("#homeMic").onclick = () => openAskSheet(true);
    let mixes = [], scenarios = [], hist = { sessions: [], stats: {} };
    try {
      [{ mixes }, { scenarios }, hist] = await Promise.all([api("/v1/learn/mixes"), api("/v1/roleplay/scenarios"), api("/v1/roleplay/history?limit=50")]);
    } catch (e) { const b = $("#homeBody"); if (b) b.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; }
    const body = $("#homeBody"); if (!body) return;
    const stats = hist.stats || {}, sessions = hist.sessions || [];
    setStreak(stats.streak_days || 0);
    const viewed = store.get("viewed", {}), progress = store.get("progress", {});
    const ready = mixes.filter((m) => m.status === "ready");
    const fresh = (kind) => ready.find((m) => m.kind === kind && !viewed[m.id]) || ready.find((m) => m.kind === kind);
    const counts = {}; sessions.forEach((h) => { counts[h.persona_id] = (counts[h.persona_id] || 0) + 1; });
    const builtin = scenarios.filter((c) => !c.custom);
    const leastPractised = builtin.slice().sort((a, b) => (counts[a.persona_id] || 0) - (counts[b.persona_id] || 0))[0];
    // Picked for you: one to listen to, one to practise, one to drill; then whatever else is ready.
    const picks = [], used = new Set();
    const pushMix = (m) => { if (m && !used.has(m.id)) { used.add(m.id); picks.push(mixCard(m, progress)); } };
    pushMix(fresh("audio"));
    if (leastPractised) picks.push(scenarioCard(leastPractised));
    pushMix(fresh("flashcards") || fresh("article"));
    for (const m of ready) { if (picks.length >= 3) break; pushMix(m); }
    const daily = builtin.length ? builtin[Math.floor(Date.now() / 86400000) % builtin.length] : null;
    const fuState = store.get("followups", {});
    const viewedIds = Object.keys(viewed).filter((id) => mixes.some((m) => String(m.id) === id));
    const listenedMin = Math.round(Object.values(progress).reduce((n, p) => n + ((p && p.position) || 0), 0) / 60);
    const personas = new Set(sessions.map((h) => h.persona_id));
    body.innerHTML = `
      <div class="h2" style="margin-top:20px">Picked for you</div>
      ${picks.length ? `<div class="carousel">${picks.join("")}</div>` : `<div class="rows"><div class="empty">Nothing to pick from yet. <a href="#/learn" style="color:var(--g700)">Generate the starter lessons</a> on Learn.</div></div>`}
      ${daily ? `<div class="daily" data-go="/prepare/scenario/${esc(daily.persona_id)}"><div class="top"><span>Daily practice</span><span class="lab">${I.prepare}Roleplay</span></div>
        <div class="ttl">${esc(daily.name)}${daily.age ? `, ${daily.age}` : ""}: ${esc(daily.scenario_title || "Practice call")}</div><div class="dur">About 5 min${daily.practicing ? ` · ${esc(daily.practicing)}` : ""}</div><span class="play">${I.play}</span></div>` : ""}
      <div class="h2">Follow-ups from your coach</div>
      <div class="rows" id="fu">${FOLLOWUPS.map(([id, text, due]) => { const done = !!fuState[id]; return `<div class="row-item plain ${done ? "done" : ""}" data-fu="${id}"><div><div class="ttl">${esc(text)}</div><div class="sub ${done ? "done" : due ? "due" : ""}">${done ? "Done" : due || "Not started"}</div></div><div class="chev bare">${I.chev}</div></div>`; }).join("")}</div>
      <div class="level" style="margin-top:22px"><h3>Your progress</h3><div class="tiles">
        <div class="tile tall"><div class="tl">Sessions complete</div><div class="tv"><span style="color:#ffd9a8">${I.flame.replace("<svg", '<svg width="13" height="13"')}</span>${(stats.sessions || 0) + viewedIds.length}</div></div>
        <div class="tile tall"><div class="tl">Topics covered</div><div class="tv">${I.flashcards}${viewedIds.length + personas.size}</div></div>
        <div class="tile tall"><div class="tl">Total time spent training</div><div class="tv">${(stats.minutes || 0) + listenedMin}<small>MINS</small></div></div>
      </div></div>`;
    body.querySelectorAll("[data-go]").forEach((el) => (el.onclick = () => go(el.dataset.go)));
    body.querySelectorAll("[data-fu]").forEach((el) => (el.onclick = () => {
      const st = store.get("followups", {}), id = el.dataset.fu, done = !st[id];
      if (done) st[id] = Date.now(); else delete st[id];
      store.set("followups", st); el.classList.toggle("done", done);
      const due = (FOLLOWUPS.find((f) => f[0] === id) || [])[2], sub = el.querySelector(".sub");
      sub.className = "sub " + (done ? "done" : due ? "due" : ""); sub.textContent = done ? "Done" : due || "Not started";
    }));
  }

  // --- Learn home ---------------------------------------------------------------
  async function renderLearn() {
    tabbar("learn");
    view.innerHTML = header(`<h1>Learn</h1><span class="spacer"></span>${streakPill(store.get("streak", 0))}<button class="iconbtn" id="menuBtn" title="Menu">${I.menu}</button>`) +
      `<main id="home"><div class="empty"><span class="spin"></span></div></main>`;
    $("#menuBtn").onclick = openMenu;
    loadStreak();
    let timer = null;
    cleanup = () => clearInterval(timer);

    const draw = async () => {
      let mixes;
      try {
        if (!status) status = await api("/v1/learn/status");
        ({ mixes } = await api("/v1/learn/mixes"));
      } catch (e) {
        $("#apiBad").hidden = false;
        $("#home").innerHTML = `<div class="errbox">${esc(e.message)}</div>`;
        return;
      }
      const home = $("#home");
      if (!home) return;
      if (!curriculum) { try { curriculum = (await api("/v1/learn/curriculum")).tiers; } catch { curriculum = []; } }
      const busy = mixes.some((m) => m.status === "queued" || m.status === "generating");
      const byKey = Object.fromEntries(mixes.filter((m) => m.curriculum_key).map((m) => [m.curriculum_key, m]));
      // Recommended = keep a beginner inside their current tier. The focus tier is the
      // lowest tier that still has an unopened lesson; we fill all three slots from that
      // tier (unopened first, then opened lessons from the same tier for review) and never
      // leapfrog into a higher tier — so the essentials lead until the tier is worked through.
      const viewedNow = store.get("viewed", {});
      const readyInTier = (t) => t.items.map((i) => byKey[i.key]).filter((m) => m && m.status === "ready");
      const focus = curriculum.find((t) => readyInTier(t).some((m) => !viewedNow[m.id])) || curriculum[curriculum.length - 1];
      const focusReady = focus ? readyInTier(focus) : [];
      const rec = focusReady.filter((m) => !viewedNow[m.id]).concat(focusReady.filter((m) => viewedNow[m.id])).slice(0, 3);
      const totalItems = curriculum.reduce((n, t) => n + t.items.length, 0);
      const missing = curriculum.reduce((n, t) => n + t.items.filter((i) => !byKey[i.key]).length, 0);
      const progress = store.get("progress", {});
      const lastId = store.get("lastAudio", null);
      const last = mixes.find((m) => m.id === lastId && m.kind === "audio" && m.status === "ready");

      let html = "";
      if (last) {
        const p = progress[last.id] || {}; const pct = p.duration ? Math.min(100, (p.position / p.duration) * 100) : 0;
        html += `<div class="continue" data-go="/mix/${last.id}">
          <div class="cover ${coverClass(last.id)}"></div>
          <div><div class="lbl">Continue listening…</div><div class="ttl">${esc(last.title)}</div>

    const c = m.content || {};
    const hasAudio = m.has_audio;
    const authFailed = c.audio_status === "failed" && /(?:\b401\b|unauthori[sz]ed)/i.test(c.audio_error || "");
    const audioError = authFailed
      ? "Azure Speech rejected the configured credentials. Use a key from the Speech resource and make sure its region or resource endpoint matches."
      : (c.audio_error || "Azure Speech is not configured.");
    view.innerHTML = closeHeader("Audio", `<button class="iconbtn" id="share">${I.share}</button><button class="iconbtn">${I.bookmark}</button>`) + `<main class="fade">
      <div class="now">NOW PLAYING</div>

        ${c.audio_status === "rendering" ? `<div style="margin-top:8px"><span class="spin"></span></div>` : `<button class="btn ghost" id="renderAudio" style="margin-top:10px;padding:9px">Render audio now</button>`}</div>`}
      <div class="transcript"><button class="toggle ${hasAudio ? "" : "open"}" id="tt">${I.chev} Transcript</button>
        <div id="turns" ${hasAudio ? "hidden" : ""}>${(c.turns || []).map((t) => `<div class="turn ${(t.speaker || "").toLowerCase().startsWith("andrew") ? "andrew" : ""}"><b>${esc(t.speaker)}</b><span>${esc(t.text)}</span></div>`).join("")}</div>
      </div>
      ${sourcesHtml(m.sources)}
    </main>`;
    $("#back").onclick = () => goBack("/learn");
    $("#share").onclick = () => { navigator.clipboard?.writeText(location.href).then(() => toast("Link copied")); };
    const tt = $("#tt"); tt.onclick = () => { tt.classList.toggle("open"); $("#turns").hidden = !$("#turns").hidden; };
    if (!hasAudio) {
      const rb = $("#renderAudio");
      if (rb) rb.onclick = async () => {
        rb.disabled = true;
        try { await api(`/v1/learn/mixes/${m.id}/render-audio`, { method: "POST" }); toast("Rendering audio…"); }
        catch (e) { toast(e.message); rb.disabled = false; return; }
        const poll = setInterval(async () => {
          try { const fresh = await api(`/v1/learn/mixes/${m.id}`); const st = fresh.content?.audio_status;
            if (fresh.has_audio || st === "failed") { clearInterval(poll); renderAudio(fresh); } }
          catch { clearInterval(poll); }
        }, 3000);
        cleanup = () => clearInterval(poll);
      }
      if (c.audio_status === "rendering") {
        const poll = setInterval(async () => {
          try { const fresh = await api(`/v1/learn/mixes/${m.id}`); if (fresh.content?.audio_status !== "rendering") { clearInterval(poll); renderAudio(fresh); } }
          catch { clearInterval(poll); }
        }, 3000);
        cleanup = () => clearInterval(poll);
      }
      return;
    }

    const audio = new Audio(`${API}/v1/learn/mixes/${m.id}/audio`);
    audio.preload = "metadata";
    const seek = $("#seek"), pp = $("#pp"), blob = $("#blob"), cur = $("#cur"), dur = $("#dur"), rate = $("#rate");
    const rates = [1, 1.25, 1.5, 0.75]; let ri = 0;
    const progress = store.get("progress", {});
    const saved = progress[m.id];
    let scrubbing = false;
    const paint = () => {
      const d = audio.duration || m.duration_seconds;
      if (!scrubbing) seek.value = audio.currentTime; seek.max = d;
      cur.textContent = mmss(audio.currentTime); dur.textContent = "-" + mmss(d - audio.currentTime);
    };
    audio.addEventListener("loadedmetadata", () => { if (saved && saved.position < audio.duration - 5) audio.currentTime = saved.position; paint(); });
    audio.addEventListener("timeupdate", () => { paint(); progress[m.id] = { position: audio.currentTime, duration: audio.duration || m.duration_seconds }; store.set("progress", progress); });
    audio.addEventListener("play", () => { pp.innerHTML = I.pause; blob.classList.add("on"); });
    audio.addEventListener("pause", () => { pp.innerHTML = I.play; blob.classList.remove("on"); });
    audio.addEventListener("ended", () => { progress[m.id] = { position: 0, duration: audio.duration }; store.set("progress", progress); });
    audio.addEventListener("error", () => toast("Couldn't load the audio"));
    pp.onclick = () => (audio.paused ? audio.play().catch(() => toast("Tap play again")) : audio.pause());
    $("#sb").onclick = () => (audio.currentTime = Math.max(0, audio.currentTime - 15));
    $("#sf").onclick = () => (audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 15));
    rate.onclick = () => { ri = (ri + 1) % rates.length; audio.playbackRate = rates[ri]; rate.textContent = rates[ri] + "x"; };
    seek.oninput = () => { scrubbing = true; cur.textContent = mmss(seek.value); };
    seek.onchange = () => { audio.currentTime = Number(seek.value); scrubbing = false; };
    cleanup = () => { audio.pause(); audio.src = ""; };
  }
