    return `<div class="sources"><h4>Sources</h4>${sources.map((s, i) => `<div class="src"><b>[${i + 1}]</b><span>${esc(s.citation)}</span></div>`).join("")}</div>`;
  }

  // --- Audio player -----------------------------------------------------------
  function renderAudio(m) {
    store.set("lastAudio", m.id);
    const c = m.content || {};
    const hasAudio = m.has_audio;
    view.innerHTML = backHeader("Audio", `<button class="iconbtn" id="share">${I.share}</button><button class="iconbtn">${I.bookmark}</button>`) + `<main class="fade">
      <div class="now">NOW PLAYING</div>
      <div class="art cover ${coverClass(m.id)}"></div>
      <div class="a-title">${esc(m.title)}</div>
      <div class="a-sub">${esc(m.summary || m.prompt)}</div>
      <div class="scrub"><input type="range" id="seek" min="0" max="${m.duration_seconds}" value="0" step="1" ${hasAudio ? "" : "disabled"}><div class="times"><span id="cur">0:00</span><span id="dur">-${mmss(m.duration_seconds)}</span></div></div>
      <div class="ctl">
        <button class="rate" id="rate">1x</button>
        <button class="skip" id="sb" title="Back 15s">${I.skipb}</button>
        <button class="pp" id="pp" ${hasAudio ? "" : "disabled"}>${I.play}</button>
        <button class="skip" id="sf" title="Forward 15s">${I.skipf}</button>
        <div class="blob" id="blob"></div>
      </div>
      ${hasAudio ? "" : `<div class="notice"><b>${c.audio_status === "rendering" ? "Recording with Ava &amp; Andrew…" : "Audio isn't rendered for this episode yet."}</b> ${c.audio_status === "rendering" ? "" : esc(c.audio_error || "Azure Speech is not configured.")} The full script is below, so you can still read along or rehearse it.
        ${c.audio_status === "rendering" ? `<div style="margin-top:8px"><span class="spin"></span></div>` : `<button class="btn ghost" id="renderAudio" style="margin-top:10px;padding:9px">Render audio now</button>`}</div>`}
      <div class="transcript"><button class="toggle ${hasAudio ? "" : "open"}" id="tt">${I.chev} Transcript</button>
        <div id="turns" ${hasAudio ? "hidden" : ""}>${(c.turns || []).map((t) => `<div class="turn ${(t.speaker || "").toLowerCase().startsWith("andrew") ? "andrew" : ""}"><b>${esc(t.speaker)}</b><span>${esc(t.text)}</span></div>`).join("")}</div>
      </div>
      ${sourcesHtml(m.sources)}
    </main>`;
    $("#back").onclick = () => go("/");
    $("#share").onclick = () => { navigator.clipboard?.writeText(location.href).then(() => toast("Link copied")); };
    const tt = $("#tt"); tt.onclick = () => { tt.classList.toggle("open"); $("#turns").hidden = !$("#turns").hidden; };
    if (!hasAudio) {
      const rb = $("#renderAudio");
      if (rb) rb.onclick = async () => {
        rb.disabled = true;
        try { await api(`/v1/learn/mixes/${m.id}/render-audio`, { method: "POST" }); toast("Rendering audio…"); }
        catch (e) { toast(e.message); rb.disabled = false; return; }
        const poll = setInterval(async () => {
          try { const fresh = await api(`/v1/learn/mixes/${m.id}`); const st = fresh.content?.audio_status;
            if (fresh.has_audio || st === "failed") { clearInterval(poll); renderAudio(fresh); } }
          catch { clearInterval(poll); }
        }, 3000);
        cleanup = () => clearInterval(poll);
      }
      if (c.audio_status === "rendering") {
        const poll = setInterval(async () => {
          try { const fresh = await api(`/v1/learn/mixes/${m.id}`); if (fresh.content?.audio_status !== "rendering") { clearInterval(poll); renderAudio(fresh); } }
          catch { clearInterval(poll); }
        }, 3000);
        cleanup = () => clearInterval(poll);
      }
      return;
    }

    const audio = new Audio(`${API}/v1/learn/mixes/${m.id}/audio`);
    audio.preload = "metadata";
    const seek = $("#seek"), pp = $("#pp"), blob = $("#blob"), cur = $("#cur"), dur = $("#dur"), rate = $("#rate");
    const rates = [1, 1.25, 1.5, 0.75]; let ri = 0;
    const progress = store.get("progress", {});
    const saved = progress[m.id];
    let scrubbing = false;
    const paint = () => {
      const d = audio.duration || m.duration_seconds;
      if (!scrubbing) seek.value = audio.currentTime; seek.max = d;
      cur.textContent = mmss(audio.currentTime); dur.textContent = "-" + mmss(d - audio.currentTime);
    };
    audio.addEventListener("loadedmetadata", () => { if (saved && saved.position < audio.duration - 5) audio.currentTime = saved.position; paint(); });
    audio.addEventListener("timeupdate", () => { paint(); progress[m.id] = { position: audio.currentTime, duration: audio.duration || m.duration_seconds }; store.set("progress", progress); });
    audio.addEventListener("play", () => { pp.innerHTML = I.pause; blob.classList.add("on"); });
    audio.addEventListener("pause", () => { pp.innerHTML = I.play; blob.classList.remove("on"); });
    audio.addEventListener("ended", () => { progress[m.id] = { position: 0, duration: audio.duration }; store.set("progress", progress); });
    audio.addEventListener("error", () => toast("Couldn't load the audio"));
    pp.onclick = () => (audio.paused ? audio.play().catch(() => toast("Tap play again")) : audio.pause());
    $("#sb").onclick = () => (audio.currentTime = Math.max(0, audio.currentTime - 15));
    $("#sf").onclick = () => (audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 15));
    rate.onclick = () => { ri = (ri + 1) % rates.length; audio.playbackRate = rates[ri]; rate.textContent = rates[ri] + "x"; };
    seek.oninput = () => { scrubbing = true; cur.textContent = mmss(seek.value); };
    seek.onchange = () => { audio.currentTime = Number(seek.value); scrubbing = false; };
    cleanup = () => { audio.pause(); audio.src = ""; };
  }

  // --- Article ----------------------------------------------------------------
  function renderArticle(m) {
    const c = m.content || {};
    const words = (c.sections || []).reduce((n, s) => n + [...(s.paragraphs || []), ...(s.bullets || [])].join(" ").split(/\s+/).length, 0);
    const hasAudio = m.has_audio;
    const rendering = c.audio_status === "rendering";
    // "Listen" sits under the byline. Until narration exists it is a call to action
    // (or a spinner while Ava records); once rendered it becomes a sticky mini player.
    const listenHtml = hasAudio
      ? `<div class="listen" id="listen"><button class="lpp" id="lpp">${I.play}</button>
          <div class="lbody"><div class="lrow"><b id="lsec">Listen · read by Ava</b><span><span id="lcur">0:00</span> / ${mmss(c.audio_seconds || 0)}</span></div>
          <input type="range" id="lseek" min="0" max="${c.audio_seconds || 0}" value="0" step="1"></div>
          <button class="lrate" id="lrate">1x</button></div>`
      : `<div class="listen cta" id="listen"><button class="lpp" id="lpp" ${rendering ? "disabled" : ""}>${rendering ? `<span class="spin white"></span>` : I.audio}</button>
          <div class="lbody"><div class="lrow"><b>${rendering ? "Recording with Ava…" : "Listen to this article"}</b><span>${rendering ? "about a minute" : `~${mins(Math.round(words / 150 * 60))}`}</span></div>
          ${rendering ? "" : c.audio_status === "failed" ? `<div class="lerr">Last attempt failed: ${esc(c.audio_error || "unknown error")}. Tap to try again.</div>` : `<div class="lrow"><span>Ava reads it aloud, hands-free.</span></div>`}</div></div>`;
    view.innerHTML = backHeader("Article", `<button class="iconbtn" id="share">${I.share}</button><button class="iconbtn">${I.bookmark}</button>`) + `<main class="fade">
      <div class="hero cover ${coverClass(m.id)}"></div>
      <h1 class="art-h1" id="intro">${esc(c.title || m.title)}</h1>
      ${c.subtitle ? `<div class="art-sub">${esc(c.subtitle)}</div>` : ""}
      <div class="art-meta">${I.article}<span>${mins(m.duration_seconds)} read · ${words} words · grounded in ${(m.sources || []).length} sources</span></div>
      ${listenHtml}
      ${(c.sections || []).map((s, i) => `<div class="sec" id="sec-${i}"><h3>${esc(s.heading)}</h3>${(s.paragraphs || []).map((p) => `<p>${esc(p)}</p>`).join("")}${(s.bullets || []).length ? `<ul>${s.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div>`).join("")}
      ${(c.key_takeaways || []).length ? `<div class="box take" id="takeaways"><h4>Key takeaways</h4><ul>${c.key_takeaways.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
      ${(c.say_it_like_this || []).length ? `<div class="box say" id="say"><h4>Say it like this</h4><ul>${c.say_it_like_this.map((t) => `<li>“${esc(t)}”</li>`).join("")}</ul></div>` : ""}
      ${(c.watch_outs || []).length ? `<div class="box warn" id="watch"><h4>Watch outs</h4><ul>${c.watch_outs.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
      ${sourcesHtml(m.sources)}
    </main>`;
    $("#back").onclick = () => go("/");
    $("#share").onclick = () => { navigator.clipboard?.writeText(location.href).then(() => toast("Link copied")); };

    const pollNarration = () => {
      const poll = setInterval(async () => {
        try { const fresh = await api(`/v1/learn/mixes/${m.id}`); if (fresh.has_audio || fresh.content?.audio_status !== "rendering") { clearInterval(poll); renderArticle(fresh); } }
        catch { clearInterval(poll); }
      }, 3000);
      cleanup = () => clearInterval(poll);
    };
    if (!hasAudio) {
      if (rendering) { pollNarration(); return; }
      $("#lpp").onclick = async () => {
        if (status && !status.speech_configured) { toast("Azure Speech isn't configured, so articles can't be narrated yet"); return; }
        $("#lpp").disabled = true;
        try { await api(`/v1/learn/mixes/${m.id}/render-audio`, { method: "POST" }); toast("Ava is recording this article…"); }
        catch (e) { toast(e.message); $("#lpp").disabled = false; return; }
        renderArticle({ ...m, content: { ...c, audio_status: "rendering" } });
      };
      return;
    }

    // --- Narration player: highlights the block Ava is reading -----------------
    const audio = new Audio(`${API}/v1/learn/mixes/${m.id}/audio`);
    audio.preload = "metadata";
    const seek = $("#lseek"), pp = $("#lpp"), cur = $("#lcur"), lsec = $("#lsec"), rate = $("#lrate");
    const rates = [1, 1.25, 1.5, 0.75]; let ri = 0;
    const narration = (c.narration || []).slice().sort((a, b) => a.start - b.start);
    const progress = store.get("progress", {});
    const saved = progress[m.id];
    let scrubbing = false, current = null;
    const highlight = (t) => {
      let seg = null;
      for (const n of narration) { if (t + 0.5 >= n.start) seg = n; else break; }
      const id = seg ? seg.id : null;
      if (id === current) return;
      if (current) document.getElementById(current)?.classList.remove("reading");
      current = id;
      const el = current ? document.getElementById(current) : null;
      if (el) { el.classList.add("reading"); lsec.textContent = seg.label; if (!audio.paused) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
    };
    const paint = () => {
      const d = audio.duration || c.audio_seconds || 0;
      if (!scrubbing) seek.value = audio.currentTime; seek.max = d;
      cur.textContent = mmss(audio.currentTime);
      highlight(audio.currentTime);
    };
    audio.addEventListener("loadedmetadata", () => { if (saved && saved.position < audio.duration - 5) audio.currentTime = saved.position; paint(); });
    audio.addEventListener("timeupdate", () => { paint(); progress[m.id] = { position: audio.currentTime, duration: audio.duration || c.audio_seconds }; store.set("progress", progress); });
    audio.addEventListener("play", () => { pp.innerHTML = I.pause; });
    audio.addEventListener("pause", () => { pp.innerHTML = I.play; });
    audio.addEventListener("ended", () => { progress[m.id] = { position: 0, duration: audio.duration }; store.set("progress", progress); if (current) document.getElementById(current)?.classList.remove("reading"); current = null; lsec.textContent = "Listen · read by Ava"; });
    audio.addEventListener("error", () => toast("Couldn't load the narration"));
    pp.onclick = () => (audio.paused ? audio.play().catch(() => toast("Tap play again")) : audio.pause());
    rate.onclick = () => { ri = (ri + 1) % rates.length; audio.playbackRate = rates[ri]; rate.textContent = rates[ri] + "x"; };
    seek.oninput = () => { scrubbing = true; cur.textContent = mmss(seek.value); };
    seek.onchange = () => { audio.currentTime = Number(seek.value); scrubbing = false; };
    cleanup = () => { audio.pause(); audio.src = ""; };
  }

  // --- Flashcards -------------------------------------------------------------
  function renderFlashcards(m) {
    const c = m.content || {};
    const all = (c.cards || []).filter((k) => k.front && k.back);
    const refs = Object.fromEntries((c.refs || []).map((r) => [r.n, r]));
    // "[1,13]" -> the excerpts the model cited, resolved to document + page.
    const refsFor = (src) => (String(src || "").match(/\d+/g) || []).map((n) => refs[Number(n)]).filter(Boolean);
    const refChips = (src) => {
      const list = refsFor(src);
      if (!list.length) return src ? `<span class="srcref">Source: ${esc(src)}</span>` : "";
      const seen = new Set();
      return `<span class="refs">` + list.filter((r) => { const k = r.doc + "|" + r.page; if (seen.has(k)) return false; seen.add(k); return true; })
        .map((r) => `<button class="refchip" data-ref="${r.n}">${esc(r.doc)}${r.page ? ` · p.${esc(r.page)}` : ""}</button>`).join("") + `</span>`;
    };
    const showRefs = (src) => {
      const list = refsFor(src);
      const sheet = document.createElement("div");
      sheet.className = "sheet-wrap";
      sheet.innerHTML = `<div class="sheet"><div class="grab"></div><div class="sheet-h">Where this comes from</div>
        ${list.map((r) => `<div class="excerpt"><div class="ex-doc">${esc(r.doc)}${r.page ? ` · page ${esc(r.page)}` : ""}</div>${r.heading ? `<div class="ex-head">${esc(r.heading)}</div>` : ""}<div class="ex-txt">${esc(r.preview)}${r.preview && r.preview.length >= 320 ? "…" : ""}</div></div>`).join("")}
        <button class="btn ghost" id="sheetClose" style="margin-top:12px">Close</button></div>`;
      const close = () => sheet.remove();
      sheet.onclick = (e) => { if (e.target === sheet) close(); };
      sheet.querySelector("#sheetClose").onclick = close;
      $("#phone").appendChild(sheet);
    };
    let deck = all.slice(), i = 0, flipped = false, results = {};
    const render = () => {
      if (i >= deck.length) return renderDone();
      const card = deck[i];
      const pct = Math.round((i / deck.length) * 100);
      view.innerHTML = backHeader("Flashcards") + `<main class="fade">
        <div class="prog"><span>${i + 1} of ${deck.length}</span><div class="track"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>
        <div class="topic-l">TOPIC</div><div class="topic">${esc(c.title || m.title)}</div>
        <div class="fc ${flipped ? "flipped" : ""}" id="fc"><div class="inner">
          <div class="face front"><div class="eyebrow"><span>QUESTION</span><span>${i + 1} / ${deck.length}</span></div><div class="mid"><div class="q">${esc(card.front)}</div></div><div class="foot">${I.flip} Tap to reveal the answer</div></div>
          <div class="face back"><div class="eyebrow"><span>ANSWER</span><span>${i + 1} / ${deck.length}</span></div><div class="mid"><div class="a">${esc(card.back)}</div></div><div class="foot">${I.flip} Tap to see the question</div></div>
        </div></div>
        <div class="grade" id="grade" ${flipped ? "" : "hidden"}><button class="btn ghost" id="again">${I.flip} Review again</button><button class="btn green" id="got">${I.check} Got it</button></div>
        <div class="nav2"><button class="navbtn" id="prev" ${i === 0 ? "disabled" : ""}>${I.back} Back</button><span class="count">${Object.values(results).filter((r) => r === true).length} known · ${Object.values(results).filter((r) => r === false).length} to review</span><button class="navbtn" id="next">${flipped ? "Next" : "Skip"} ${I.chev}</button></div>
        ${card.source ? `<div class="srcrow" id="srcrow" ${flipped ? "" : "hidden"}><div class="lbl">WHERE THIS COMES FROM</div>${refChips(card.source)}</div>` : ""}
      </main>`;
      $("#back").onclick = () => go("/");
      $("#fc").onclick = () => {
        flipped = !flipped; $("#fc").classList.toggle("flipped", flipped); $("#grade").hidden = !flipped;
        const sr = $("#srcrow"); if (sr) sr.hidden = !flipped;
        $("#next").innerHTML = `${flipped ? "Next" : "Skip"} ${I.chev}`;
      };
      const sr = $("#srcrow");
      if (sr) sr.querySelectorAll(".refchip").forEach((chip) => (chip.onclick = () => showRefs(card.source)));
      const mark = (ok) => { results[card.front] = ok; flipped = false; i += 1; render(); };
      $("#got").onclick = (e) => { e.stopPropagation(); mark(true); };
      $("#again").onclick = (e) => { e.stopPropagation(); mark(false); };
      $("#next").onclick = () => { if (!(card.front in results)) results[card.front] = flipped ? true : null; flipped = false; i += 1; render(); };
      $("#prev").onclick = () => { flipped = false; i = Math.max(0, i - 1); render(); };
    };
    const renderDone = () => {
      const missed = deck.filter((k) => results[k.front] === false);
      const known = deck.filter((k) => results[k.front] === true).length;
      view.innerHTML = backHeader("Flashcards") + `<main class="fade"><div class="done">
        <div class="score">${known}/${deck.length}</div>
        <p>${missed.length ? `Nice work. ${missed.length} card${missed.length > 1 ? "s" : ""} to review again.` : "You've got this deck down."}</p>
        ${missed.length ? `<button class="btn orange" id="reviewMissed">Review the ${missed.length} missed</button>` : ""}
        <button class="btn ghost" id="restart" style="margin-top:10px">Start over</button>
        ${missed.length ? `<div class="missed rows" style="margin-top:18px">${missed.map((k) => `<div class="row-item"><div class="ic">${I.flashcards}</div><div><div class="ttl">${esc(k.front)}</div><div class="sub">${esc(k.back)}</div></div><div></div></div>`).join("")}</div>` : ""}
      </div></main>`;
      $("#back").onclick = () => go("/");
      const rm = $("#reviewMissed"); if (rm) rm.onclick = () => { deck = missed; i = 0; results = {}; render(); };
      $("#restart").onclick = () => { deck = all.slice(); i = 0; results = {}; render(); };
    };
    render();
  }

  function when(iso) {
    if (!iso) return "";
    const d = new Date(iso), now = new Date();
    const days = Math.floor((now - d) / 86400000);
    if (days === 0) return `Today ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
    if (days === 1) return "Yesterday";
    if (days < 7) return `${days} days ago`;
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  // --- Scenario brief (who you're about to call) ---------------------------------

  // --- Speech: Azure Speech SDK in the browser (STT + TTS on a short-lived token) -----
  const speech = { loading: null, token: null, region: null, tokenProfileId: "", profile: null,
    recognizer: null, recognizing: false, synthesizer: null, synthKey: null, player: null,
    audioPaused: false, generation: 0, firstChunkAt: null };

  function loadSpeechSdk() {
    if (window.SpeechSDK) return Promise.resolve(window.SpeechSDK);
    if (!speech.loading) speech.loading = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://aka.ms/csspeech/jsbrowserpackageraw";
      s.onload = () => res(window.SpeechSDK);
      s.onerror = () => { speech.loading = null; rej(new Error("Couldn't load the speech library")); };
      document.head.appendChild(s);
    });
    return speech.loading;
  }

  async function ensureSpeechToken() {
    const wantId = speech.profile ? speech.profile.id : "";
    if (speech.token && speech.region && speech.tokenProfileId === wantId) return;
    const data = await api("/v1/speech/token", { method: "POST", body: JSON.stringify({ profile_id: wantId }) });
    speech.token = data.token; speech.region = data.region; speech.tokenProfileId = wantId;
    if (data.profile) speech.profile = data.profile;
  }

  function teardownRecognizer() {
    const rec = speech.recognizer; speech.recognizer = null; speech.recognizing = false;
    if (!rec) return;
    const close = () => { try { rec.close(); } catch {} };
    try { rec.stopContinuousRecognitionAsync(close, close); } catch { close(); }
  }

  function getSynthesizer(voiceName) {
    const SDK = window.SpeechSDK;
    const key = `${voiceName}|${speech.profile ? speech.profile.id : ""}|${speech.tokenProfileId}`;
    if (speech.synthesizer && speech.synthKey === key) return speech.synthesizer;
    if (speech.synthesizer) { try { speech.synthesizer.close(); } catch {} }
    const cfg = SDK.SpeechConfig.fromAuthorizationToken(speech.token, speech.region);
    cfg.speechSynthesisVoiceName = voiceName;
    const fmt = speech.profile && speech.profile.output_format;
    if (fmt && SDK.SpeechSynthesisOutputFormat[fmt] !== undefined) cfg.speechSynthesisOutputFormat = SDK.SpeechSynthesisOutputFormat[fmt];
    // An explicit speaker destination is what makes pause/resume/stop possible.
    let audioCfg = null; speech.player = null;
    try { speech.player = new SDK.SpeakerAudioDestination(); audioCfg = SDK.AudioConfig.fromSpeakerOutput(speech.player); } catch { speech.player = null; }
    speech.synthesizer = audioCfg ? new SDK.SpeechSynthesizer(cfg, audioCfg) : new SDK.SpeechSynthesizer(cfg);
    speech.synthKey = key;
    speech.synthesizer.synthesizing = () => { if (speech.firstChunkAt === null) speech.firstChunkAt = performance.now(); };
    try { SDK.Connection.fromSynthesizer(speech.synthesizer).openConnection(); } catch {}
    return speech.synthesizer;
  }

  // Resolves once the reply has finished PLAYING (not just synthesising), so the mic
  // does not reopen while the prospect is still talking.
  async function speak(text, voiceName, ssml) {
    const empty = { firstByteMs: null, totalMs: null, firstByteAt: null, audioLengthMs: null };
    if (!text || !window.SpeechSDK || !speech.token) return empty;
    const synth = getSynthesizer(voiceName);
    speech.firstChunkAt = null;
    const generation = speech.generation, startedAt = performance.now();
    let settled = false;
    const synthesis = new Promise((resolve) => {
      const fail = () => { try { synth.close(); } catch {} speech.synthesizer = null; speech.synthKey = null; speech.token = null; resolve(null); };
      if (ssml) synth.speakSsmlAsync(ssml, resolve, fail); else synth.speakTextAsync(text, resolve, fail);
    }).then((r) => { settled = true; return r; });
    const abortWatch = new Promise((resolve) => { const tick = () => { if (settled) return; if (generation !== speech.generation) return resolve(null); setTimeout(tick, 100); }; tick(); });
    const result = await Promise.race([synthesis, abortWatch]);
    const synthesisMs = performance.now() - startedAt;
    const firstByteMs = speech.firstChunkAt === null ? null : speech.firstChunkAt - startedAt;
    if (generation !== speech.generation) return { firstByteMs, totalMs: synthesisMs, firstByteAt: speech.firstChunkAt, audioLengthMs: null };
    const audioLengthMs = result && result.audioDuration ? result.audioDuration / 10000 : null;
    if (audioLengthMs !== null) {
      const base = speech.firstChunkAt === null ? startedAt : speech.firstChunkAt;
      let remaining = base + audioLengthMs - performance.now();
      while (remaining > 0) { if (generation !== speech.generation) break; await new Promise((r) => setTimeout(r, 100)); if (!speech.audioPaused) remaining -= 100; }
    }
    return { firstByteMs, totalMs: synthesisMs, firstByteAt: speech.firstChunkAt, audioLengthMs };
  }

  function pauseAudio() { speech.audioPaused = true; if (speech.player) { try { speech.player.pause(); } catch {} } }
  function resumeAudio() { speech.audioPaused = false; if (speech.player) { try { speech.player.resume(); } catch {} } }
  function stopAudio() {
    speech.generation += 1; speech.audioPaused = false;
    if (speech.player) { try { speech.player.pause(); } catch {} try { speech.player.close(); } catch {} }
    if (speech.synthesizer) { try { speech.synthesizer.close(); } catch {} }
    speech.player = null; speech.synthesizer = null; speech.synthKey = null;
  }

  // --- Live call ------------------------------------------------------------------------
  let live = null;

  async function startCall(personaId) {

      paused: false, askOpen: false, modalOpen: false, thinking: false, speaking: false, transcriptOn: false,

  const STATUS = { listening: "I'M LISTENING…", thinking: "THINKING…", speaking: (n) => `${n.toUpperCase()} IS SPEAKING…`, paused: "PAUSED", text: "TYPE YOUR LINE BELOW" };

      <div class="typebox"><input id="typed" placeholder="Or type what you'd say…" autocomplete="off"><button id="send" title="Send">${I.share.replace('<path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>', "")}</button></div>

        <div><button class="cbtn ai" id="ask" title="Ask Navigator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></button><span class="lbl">Ask Navigator</span></div>

    const typed = $("#typed");
    const sendTyped = () => { const t = typed.value.trim(); if (!t) return; typed.value = ""; handleAgentText(t); };
    $("#send").onclick = sendTyped; typed.onkeydown = (e) => { if (e.key === "Enter") sendTyped(); };

    clearInterval(s.timer);
    s.timer = setInterval(paintClock, 1000); paintClock();
    cleanup = () => { clearInterval(s.timer); teardownRecognizer(); stopAudio(); if (live && live.id === sid && !live.finished) { live = null; } };
    paintTranscript();
    bootVoice();
  }

  function paintClock() {
    if (!live) return;
    const el = $("#clock"); if (!el) return;
    el.textContent = mmss((Date.now() - live.startedAt) / 1000);
  }

  function setStatus(mode) {
    if (!live) return;
    const st = $("#status"), orb = $("#orb"); if (!st || !orb) return;
    live.mode = mode;
    const label = typeof STATUS[mode] === "function" ? STATUS[mode](live.scenario.name) : STATUS[mode];
    st.textContent = label; st.className = "status" + (mode === "paused" ? " off" : mode === "text" ? " warn" : "");
    orb.className = "orb " + (mode === "paused" || mode === "text" ? "paused" : mode);
  }

  function paintTranscript() {
    if (!live) return;
    const box = $("#tlines"); if (!box) return;
    const turns = live.turns;
    while (live.stamps.length < turns.length) live.stamps.push(mmss((Date.now() - live.startedAt) / 1000));
    box.innerHTML = turns.length ? turns.map((t, i) => `<div class="turn ${t.speaker === "agent" ? "you" : ""}"><b>${t.speaker === "agent" ? "You" : esc(live.scenario.name)}<br><i>${live.stamps[i]}</i></b><span>${esc(t.text)}</span></div>`).join("")
      : `<div class="empty">Say hello to start the call.</div>`;
    box.scrollTop = box.scrollHeight;
  }

  // Voice set-up: token, TTS connection, and the continuous recognizer. Falls back to
  // text-only (the type box) when the SDK, mic, or key isn't available.
  async function bootVoice() {
    if (!live) return;
    const s = live;
    if (s.language !== "en" && !s.sttLocale) {
      // A practice language Azure cannot transcribe: the call runs as text.
      s.voice = "off"; s.voiceError = `Voice isn't available in ${s.languageName} yet`;
      setStatus("text"); toast(`${s.voiceError}. You can still type.`);
      return;
    }
    try {
      await loadSpeechSdk();
      await ensureSpeechToken();
      s.voice = "ready";
      if (s.voiceName) { try { getSynthesizer(s.voiceName); } catch {} }
      await startListening();
      if (!s.paused) setStatus(speech.recognizing ? "listening" : "text");
    } catch (e) {
      s.voice = "off"; s.voiceError = e.message;
      setStatus("text");
      toast(/mic|permission|NotAllowed/i.test(e.message) ? "Microphone blocked. You can still type." : `Voice unavailable: ${e.message}`);
    }
  }

  const canListen = () => !!live && !live.paused && !live.askOpen && !live.modalOpen && !live.finished;
  const acceptingSpeech = () => canListen() && speech.recognizing && !live.thinking && !live.speaking;

  async function ensureRecognizer() {
    if (speech.recognizer) return speech.recognizer;
    const SDK = await loadSpeechSdk();
    await ensureSpeechToken();
    const cfg = SDK.SpeechConfig.fromAuthorizationToken(speech.token, speech.region);
    cfg.speechRecognitionLanguage = (live && live.sttLocale) || "en-US";
    try { cfg.setProperty(SDK.PropertyId.Speech_SegmentationSilenceTimeoutMs, "700"); } catch {}
    const rec = new SDK.SpeechRecognizer(cfg, SDK.AudioConfig.fromDefaultMicrophoneInput());
    rec.recognized = (_, e) => {
      if (!e.result || e.result.reason !== SDK.ResultReason.RecognizedSpeech) return;
      const text = (e.result.text || "").trim();
      let latencyMs = null, source = "unavailable";
      try { const raw = e.result.properties.getProperty(SDK.PropertyId.SpeechServiceResponse_RecognitionLatencyMs); if (raw) { latencyMs = Number(raw); source = "sdk"; } } catch {}
      if (live) live.sttMetrics = { latencyMs, source, recognizedAt: performance.now() };
      if (text && acceptingSpeech()) handleAgentText(text);
    };
    rec.canceled = (_, e) => {
      // Token/connection dropped, or the mic was refused: rebuild on the next start.
      speech.token = null; teardownRecognizer();
      if (live && e && e.errorDetails && /permission|microphone|NotAllowed/i.test(e.errorDetails)) { live.voice = "off"; setStatus("text"); toast("Microphone blocked. You can still type."); }
    };
    speech.recognizer = rec;
    return rec;
  }

  async function startListening() {
    // Text-only calls (no SDK, no key, mic refused) never touch the recognizer.
    if (speech.recognizing || !canListen() || live.voice !== "ready") return;
    let rec;
    try { rec = await ensureRecognizer(); } catch (e) { if (live) { live.voice = "off"; live.voiceError = e.message; setStatus("text"); } return; }
    if (!rec || speech.recognizing || !canListen()) return;
    speech.recognizing = true;
    await new Promise((res) => rec.startContinuousRecognitionAsync(res, (err) => { speech.recognizing = false; res(); if (live) { live.voice = "off"; live.voiceError = String(err || ""); } }));
  }
  const stopListening = () => teardownRecognizer();

  async function handleAgentText(text) {
    if (!live || live.thinking || live.finished) return;
    const s = live; s.thinking = true;
    const stt = s.sttMetrics; s.sttMetrics = null;
    s.turns = s.turns.concat([{ speaker: "agent", text }]); paintTranscript();
    setStatus("thinking");
    try {
      const sentAt = performance.now();
      const data = await api(`/v1/roleplay/sessions/${s.id}/turn`, { method: "POST", body: JSON.stringify({ agent_text: text }) });
      const httpTurnMs = performance.now() - sentAt;
      if (!live || live.id !== s.id) return;
      s.phase = data.phase || "active";
      s.turns = data.transcript || s.turns; paintTranscript();
      s.speaking = true; setStatus("speaking");
      const tts = s.voice === "ready" ? await speak(data.customer_reply, data.voice_name || s.voiceName, data.ssml) : null;
      if (s.voice !== "ready") await new Promise((r) => setTimeout(r, Math.min(4000, 600 + data.customer_reply.length * 30)));
      let mouthToEar = null;
      if (stt && stt.latencyMs != null && tts && tts.firstByteAt != null) mouthToEar = tts.firstByteAt - (stt.recognizedAt - stt.latencyMs);
      fetch(`/v1/roleplay/sessions/${s.id}/metrics`, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
        body: JSON.stringify({ turn: data.turn, stt_recognize_ms: stt ? stt.latencyMs : null, http_turn_ms: httpTurnMs,
          tts_first_byte_ms: tts ? tts.firstByteMs : null, tts_total_ms: tts ? tts.totalMs : null, tts_audio_length_ms: tts ? tts.audioLengthMs : null, mouth_to_ear_ms: mouthToEar }) }).catch(() => {});
    } catch (e) {
      toast(e.message);
    }
    if (!live || live.id !== s.id) return;
    await new Promise((r) => setTimeout(r, 300));
    s.speaking = false; s.thinking = false;
    if (s.phase === "ended") { finishCall(); return; }
    if (!s.paused && !s.askOpen && !s.modalOpen) setStatus(s.voice === "ready" && speech.recognizing ? "listening" : "text");
  }

  function togglePause() {
    if (!live) return;
    live.paused = !live.paused;
    $("#pause").classList.toggle("on", live.paused);
    $("#pause").innerHTML = live.paused ? I.play : I.pause;
    if (live.paused) { setStatus("paused"); pauseAudio(); stopListening(); }
    else { resumeAudio(); setStatus(live.speaking ? "speaking" : (live.voice === "ready" ? "listening" : "text")); startListening(); }
  }

  function openStopModal() {
    if (!live) return go("/prepare");
    live.modalOpen = true; pauseAudio(); stopListening(); setStatus("paused");
    const w = document.createElement("div"); w.className = "sheet-wrap center";
    w.innerHTML = `<div class="modal"><h3>End this call?</h3><p>You'll get your coaching report right away. Or keep going and see where ${esc(live.scenario.name)} takes it.</p>
      <button class="btn orange" id="mEnd">End and get feedback</button><button class="btn ghost" id="mCont">Keep talking</button></div>`;
    $("#phone").appendChild(w);
    w.querySelector("#mCont").onclick = () => { w.remove(); if (!live) return; live.modalOpen = false; if (!live.paused) { resumeAudio(); setStatus(live.speaking ? "speaking" : (live.voice === "ready" ? "listening" : "text")); startListening(); } };
    w.querySelector("#mEnd").onclick = () => { w.remove(); stopAudio(); finishCall(); };
  }

  function openAsk() {
    if (!live) return;
    const s = live; s.askOpen = true; stopListening();
    const w = document.createElement("div"); w.className = "sheet-wrap";
    w.innerHTML = `<div class="sheet"><div class="grab"></div><div class="sheet-h">Ask Navigator</div>
      <div class="ask-log" id="askLog"></div>
      <div class="chips" style="margin:0 0 4px"><span class="chip" data-q="What do I ask next?">What do I ask next?</span><span class="chip" data-q="How do I handle the objection they just raised?">Handle this objection</span><span class="chip" data-q="Show me the approved wording for what I'm about to say.">Approved wording</span></div>
      <div class="ask-input"><input id="askText" placeholder="Ask your coach…" autocomplete="off"><button id="askSend">${I.share.replace('<path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>', "")}</button></div></div>`;
    $("#phone").appendChild(w);
    const log = w.querySelector("#askLog");
    const paint = () => { log.innerHTML = (s.askLog.length ? s.askLog : [{ who: "ai", text: `I'm listening in. Ask me what to say next, how to handle an objection, or for the approved wording on a product point.` }]).map((m) => `<div class="bubble ${m.who}${m.pending ? " pending" : ""}">${esc(m.text)}</div>`).join(""); log.scrollTop = log.scrollHeight; };
    paint();
    const send = async (q) => {
      q = (q || "").trim(); if (!q) return;
      s.askLog.push({ who: "user", text: q }); const pending = { who: "ai", text: "Thinking…", pending: true }; s.askLog.push(pending); paint();
      try { const d = await api(`/v1/roleplay/sessions/${s.id}/ask`, { method: "POST", body: JSON.stringify({ question: q }) }); pending.text = d.answer || "No answer available."; }
      catch { pending.text = "I couldn't reach the source library just now. Keep it discovery-focused and avoid guarantees."; }
      pending.pending = false; paint();
    };
    const input = w.querySelector("#askText");
    w.querySelector("#askSend").onclick = () => { send(input.value); input.value = ""; };
    input.onkeydown = (e) => { if (e.key === "Enter") { send(input.value); input.value = ""; } };
    w.querySelectorAll(".chip").forEach((c) => (c.onclick = () => send(c.dataset.q)));
    const close = () => { w.remove(); if (!live) return; live.askOpen = false; if (!live.paused && !live.modalOpen) { setStatus(live.speaking ? "speaking" : (live.voice === "ready" ? "listening" : "text")); startListening(); } };
    w.onclick = (e) => { if (e.target === w) close(); };
    setTimeout(() => input.focus(), 50);
  }

  async function finishCall() {
    if (!live || live.finished) return;
    const s = live; s.finished = true;
    clearInterval(s.timer); stopListening(); stopAudio();
    $("#tabbar").hidden = true;
    view.innerHTML = backHeader("Call report") + `<main><div class="gen fade">
      <div class="cover ${coverFor(s.scenario.persona_id)}" style="width:110px;height:110px;border-radius:26px;margin:0 auto;position:relative"><span class="brief-hero big" style="position:absolute;left:0;right:0;top:28px;font-family:var(--serif);font-size:44px;font-weight:700;color:#fff;background:none;height:auto">${esc(initial(s.scenario.name))}</span></div>
      <h3>Reviewing your call with ${esc(s.scenario.name)}</h3><p>Grading the conversation against the playbook and checking your product claims against the source documents.</p>
      <div class="steps"><div><b>1</b>Reading the transcript</div><div><b>2</b>Checking what you said against the sources</div><div><b>3</b>Writing your coaching notes</div></div>
      <div style="margin-top:26px"><span class="spin lg"></span></div></div></main>`;
    $("#back").onclick = () => go("/prepare");
    cleanup = null;
    try {
      const r = await api(`/v1/roleplay/sessions/${s.id}/feedback`, { method: "POST" });
      lastReport = { id: r.history_id, persona_id: r.scenario.persona_id, persona_name: r.scenario.name, scenario_title: r.scenario.scenario_title,
        outcome: r.outcome, outcome_label: r.outcome_label, elapsed_seconds: r.elapsed_seconds, turn_count: r.turn_count,
        turns: r.transcript, feedback: r.feedback, verification_events: r.verification_events, ended_at: new Date().toISOString() };
      live = null;
      go(`/prepare/report/${r.history_id || "last"}`);
    } catch (e) {
      live = null;
      view.querySelector("main").innerHTML = `<div class="errbox"><b>Couldn't build the report.</b><br>${esc(e.message)}</div><button class="btn green" id="toPrep">Back to Prepare</button>`;
      $("#toPrep").onclick = () => go("/prepare");
    }
  }

  // --- Report ---------------------------------------------------------------------------
  async function renderReport(id) {
    tabbar("prepare");
    view.innerHTML = backHeader("Call report") + `<main><div class="empty"><span class="spin lg"></span></div></main>`;
    $("#back").onclick = () => go("/prepare");
    let r;
    if (id === "last" && lastReport) r = lastReport;
    else if (lastReport && String(lastReport.id) === String(id)) r = lastReport;
    else { try { r = await api(`/v1/roleplay/history/${id}`); } catch (e) { view.querySelector("main").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; return; } }
    const f = r.feedback || {};
    const facts = (r.verification_events || []).filter((v) => v.verification && v.verification.verdict !== "not_checked");
    const flagged = facts.filter((v) => v.verification.verdict === "unsupported");
    const VLBL = { supported: "Backed by the sources", unsupported: "Contradicted by the sources", not_enough_context: "Not covered by the sources" };
    const list = (items, empty) => items && items.length ? `<ul>${items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="small muted" style="margin:0">${empty}</p>`;
    const main = view.querySelector("main"); main.className = "fade";
    main.innerHTML = `
      <div class="hero cover ${coverFor(r.persona_id)}" style="height:110px;position:relative"><span class="brief-hero big" style="position:absolute;left:16px;bottom:10px;background:none;height:auto;font-family:var(--serif);font-size:44px;font-weight:700;color:#fff;line-height:1">${esc(initial(r.persona_name))}</span></div>
      <h1 class="art-h1" style="margin-bottom:2px">Call with ${esc(r.persona_name)}</h1>
      <div class="art-sub">${esc(r.scenario_title || "Custom scenario")}</div>
      <div class="outcome"><div><div class="o-lbl">How it ended</div><div class="o-val">${esc(r.outcome_label || "Call did not reach an ending")}</div></div>
        <div class="o-meta">${mins(r.elapsed_seconds)} on the call<br>${r.turn_count || 0} exchange${r.turn_count === 1 ? "" : "s"}${r.ended_at ? `<br>${esc(when(r.ended_at))}` : ""}</div></div>
      <div class="box take"><h4>What you did well</h4>${list(f.what_went_well, "Nothing specific stood out yet. Longer calls give the coach more to work with.")}</div>
      <div class="box say"><h4>What to improve</h4>${list(f.what_to_improve, "No fixes flagged.")}</div>
      <div class="box warn"><h4>What not to repeat</h4>${list(f.what_to_avoid, "Nothing the playbook says to avoid. Keep it that way.")}</div>
      ${facts.length ? `<div class="sources"><h4>Your product claims, checked</h4>${facts.map((v) => `<div class="fact ${v.verification.verdict}"><i></i><div><div class="q">“${esc(v.agent_text)}”</div><div class="v">${VLBL[v.verification.verdict] || v.verification.verdict}</div>${v.verification.issue ? `<div class="small muted">${esc(v.verification.issue)}</div>` : ""}</div></div>`).join("")}</div>` : ""}
      <div class="transcript"><button class="toggle" id="tt">${I.chev} Transcript</button>
        <div id="tl" class="tlines" hidden>${(r.turns || []).map((t) => `<div class="turn ${t.speaker === "agent" ? "you" : ""}"><b>${t.speaker === "agent" ? "You" : esc(r.persona_name)}</b><span>${esc(t.text)}</span></div>`).join("") || `<div class="empty">No transcript.</div>`}</div></div>
      <button class="btn green" style="margin-top:22px" id="again">Practise this again</button>
      <button class="btn ghost" style="margin-top:10px" id="done">Back to Prepare</button>
      ${r.id ? `<button class="link" id="delRep" style="display:block;margin:14px auto 0;color:var(--muted)">Delete this report</button>` : ""}`;
    $("#tt").onclick = () => { $("#tt").classList.toggle("open"); $("#tl").hidden = !$("#tl").hidden; };
    $("#again").onclick = () => go(`/prepare/scenario/${r.persona_id}`);
    $("#done").onclick = () => go("/prepare");
    const del = $("#delRep");
    if (del) del.onclick = async () => { try { await api(`/v1/roleplay/history/${r.id}`, { method: "DELETE" }); if (lastReport && lastReport.id === r.id) lastReport = null; toast("Report deleted"); go("/prepare"); } catch (e) { toast(e.message); } };
    if (flagged.length) toast(`${flagged.length} claim${flagged.length > 1 ? "s" : ""} contradicted the sources`);
  }

  (async () => {
    renderSplash();
    const shownAt = Date.now();
    await ensureSignedIn();
    await new Promise((r) => setTimeout(r, Math.max(0, 1400 - (Date.now() - shownAt))));
    route();
  })();
})();
</script>
</body>
</html>
